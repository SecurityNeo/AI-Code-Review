<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=9"></script>
    <style>html{background-color:#f8fafc;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 能力中心 - CodeGuard</title>
    <script src="js/auth.js?v=9"></script>
    <script src="js/menu-config.js?v=9"></script>
    <script src="js/sidebar.js?v=9"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <script src="/static/js/tailwindcss.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #fff;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }
        body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Layout */
        .container { padding: 1.5rem 2rem; width: 100% !important; max-width: none !important; }
        @media (max-width: 1023px) { .container { padding: 1rem; } }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: .5rem; margin: 0; }
        .header p { margin: .25rem 0 0; font-size: .875rem; color: var(--text-3); }
        .header-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .header-actions a, .header-actions button {
            display: inline-flex; align-items: center; gap: .375rem;
            padding: .4rem .75rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500;
            color: var(--text-2); background: #fff; border: 1px solid var(--border);
            text-decoration: none; cursor: pointer; transition: all .15s;
        }
        .header-actions a:hover, .header-actions button:hover { background: #f8fafc; border-color: #cbd5e1; }

        .status-badge {
            display: inline-flex; align-items: center; gap: .375rem;
            padding: .35rem .75rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500;
        }
        .status-ok { background: #ecfdf5; color: #166534; }
        .status-err { background: #fee2e2; color: #991b1b; }
        .status-check { background: #eff6ff; color: #1e40af; }
        .status-idle { background: #f1f5f9; color: var(--text-3); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; display: flex; align-items: center; gap: .75rem; }
        .stat-icon { width: 2.25rem; height: 2.25rem; border-radius: .625rem; display: flex; align-items: center; justify-content: center; font-size: .875rem; }
        .stat-label { font-size: .75rem; color: var(--text-3); font-weight: 500; }
        .stat-num { font-size: 1.25rem; font-weight: 700; color: var(--text); }

        /* Two columns */
        @media (max-width: 1023px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 639px) {
            .stats { grid-template-columns: 1fr; }
        }

        /* Tabs */
        .tabs { display: flex; gap: .25rem; margin-bottom: 1.25rem; padding: .25rem; background: #f1f5f9; border-radius: .625rem; width: fit-content; }
        .tab { padding: .4rem .875rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500; border: none; background: transparent; color: var(--text-3); cursor: pointer; transition: all .15s; }
        .tab:hover { color: var(--text); }
        .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.07); }

        /* Cards */
        .grid-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: .75rem; }
        @media (max-width: 1023px) { .grid-cards { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 639px) { .grid-cards { grid-template-columns: 1fr; } }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: .75rem;
            padding: 1rem; transition: box-shadow .2s, border-color .15s; cursor: pointer; position: relative;
            display: flex; flex-direction: column;
        }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); border-color: #cbd5e1; }

        .card-top { display: flex; align-items: flex-start; gap: .625rem; }
        .card-icon {
            width: 2rem; height: 2rem; border-radius: .5rem; display: flex; align-items: center; justify-content: center;
            font-size: .875rem; color: #fff; flex-shrink: 0;
        }
        .card-head { flex: 1; min-width: 0; }
        .card-title { font-size: .875rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: .4rem; }
        .card-name { font-family: ui-monospace, 'SF Mono', monospace; font-size: .75rem; color: var(--text-3); font-weight: 400; }
        .card-body { font-size: .8125rem; color: var(--text-2); margin-top: .375rem; line-height: 1.5; }
        .card-tags { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: auto; padding-top: .75rem; }
        .tag {
            font-size: .6875rem; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; letter-spacing: .01em;
        }
        .tag-blue { background: #eff6ff; color: #1e40af; }
        .tag-amber { background: #fffbeb; color: #92400e; }
        .tag-red { background: #fee2e2; color: #991b1b; }
        .tag-gray { background: #f1f5f9; color: var(--text-2); }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 9999;
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card); border-radius: .75rem; border: 1px solid var(--border);
            width: 100%; max-width: 600px; max-height: 85vh;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .modal-close {
            width: 1.75rem; height: 1.75rem; border-radius: .375rem; border: none;
            background: #f1f5f9; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #e2e8f0; color: var(--text); }
        .modal-body { padding: 1.25rem; overflow-y: auto; flex: 1; }
        .modal-section { margin-bottom: 1.25rem; }
        .modal-section:last-child { margin-bottom: 0; }
        .modal-label { font-size: .75rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .5rem; display: flex; align-items: center; gap: .375rem; }
        .modal-desc { font-size: .875rem; color: var(--text-2); line-height: 1.6; background: #f8fafc; border-radius: .5rem; padding: .875rem 1rem; border: 1px solid #e2e8f0; }
        .modal-code-block { background: #0f172a; color: #e2e8f0; border-radius: .5rem; padding: .875rem 1rem; font-family: ui-monospace, 'SF Mono', monospace; font-size: .8125rem; line-height: 1.6; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
        .modal-code-block code { color: inherit; }
        .modal-phrase {
            display: inline-block; background: #f8fafc; border: 1px solid #e2e8f0;
            padding: .375rem .625rem; border-radius: .375rem; font-size: .8125rem; color: var(--text-2);
            margin: .125rem .25rem .125rem 0; cursor: default;
        }
        .modal-phrase:hover { border-color: #cbd5e1; background: #fff; }
        .modal-warning {
            background: #fffbeb; border: 1px solid #fde68a; border-radius: .5rem;
            padding: .625rem .875rem; font-size: .8125rem; color: #92400e; display: flex; align-items: flex-start; gap: .5rem;
        }
        .modal-warning i { margin-top: .125rem; flex-shrink: 0; }
        .modal-badge { font-size: .6875rem; font-weight: 600; padding: .125rem .5rem; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; }
        .modal-badge-blue { background: #dbeafe; color: #1d4ed8; }
        .modal-badge-amber { background: #fef3c7; color: #92400e; }
        .modal-meta { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }

        /* Responsive */
        @media (max-width: 1023px) {
            .grid-cards { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }
    </style>
</head>
<body class="bg-gray-50">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#f8fafc;z-index:99999;transition:opacity .25s ease;"></div>

(function(){function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}})();

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">加载中...</nav>
    </aside>
    <main class="flex-1 overflow-y-auto">
        <div class="container">

            <!-- Header -->
            <div class="header">
                <div>
                    <h1><i class="fas fa-robot text-indigo-600"></i>MCP 能力中心</h1>

                </div>
                <div class="header-actions">

            <div class="stats">
                <div class="stat">

                </div>
                <div class="stat">

                </div>

<script>
let MCP_TOOLS = [];

function escapeHtml(str) {
    if (typeof str !== 'string') return str;
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadMCPTools() {
    try {
        const resp = await apiFetch('/api/v1/mcp-tools?page_size=100');
        const json = await resp.json();
        if (json.data && Array.isArray(json.data)) {
            MCP_TOOLS = json.data.map(t => {
                // Parse JSON string fields returned from backend
                try { t.tags = JSON.parse(t.tags || '[]'); } catch(e) { t.tags = []; }
                try { t.params = JSON.parse(t.params || '[]'); } catch(e) { t.params = []; }
                try { t.phrases = JSON.parse(t.phrases || '[]'); } catch(e) { t.phrases = []; }
                try { t.requires = JSON.parse(t.requires || '[]'); } catch(e) { t.requires = []; }
                // response_example 为纯 JSON 字符串，不需要 JSON.parse（会二次转义），前端直接展示即可
                return t;
            });
            updateStats();
            renderCards('all');
        }
    } catch (err) {
        console.error('load mcp tools failed', err);
        document.getElementById('capabilityGrid').innerHTML = '<div style="text-align:center;padding:2rem;color:#94a3b8;">加载失败，请刷新重试</div>';
    }
}

let currentCategory='all', currentPage=1, pageSize=9, totalPages=1, totalCount=0;

/* ---------- Render Cards ---------- */
function renderCards(category) {
    const tools = category==='all' ? MCP_TOOLS : MCP_TOOLS.filter(t=>t.category===category);
    totalCount = tools.length;
    totalPages = Math.max(1, Math.ceil(totalCount / pageSize));
    const page = Math.min(currentPage, totalPages);
    const start = (page - 1) * pageSize;
    const pageTools = tools.slice(start, start + pageSize);

    document.getElementById('capabilityGrid').innerHTML = pageTools.map(t=>`
        <div class="card" onclick="openDetail('${t.tool_name}')">
            <div class="card-top">
                <div class="card-icon" style="background:${t.color};"><i class="fas ${t.icon}"></i></div>
                <div class="card-head">
                    <div class="card-title">${t.display_name}</div>
                    <div class="card-name">${t.tool_name}</div>
                    <div class="card-body">${t.description}</div>
                </div>
            </div>
            <div class="card-tags">
                ${t.tags.map(tag=>`<span class="tag ${t.dangerous?'tag-amber':tag==='只读'?'tag-blue':'tag-gray'}">${tag}</span>`).join('')}
            </div>
        </div>
    `).join('');

    document.getElementById('totalCount').textContent = `共 ${totalCount} 条记录`;
    renderPagination();
}
function filterCategory(cat) {
    currentCategory = cat;
    currentPage = 1;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.category===cat));
    renderCards(cat);
}
function renderPagination() {
    const pagination = document.getElementById('pagination');
    if (!pagination) return;

    const page = currentPage;
    const pages = totalPages;
    if (pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';
    // 上一页
    html += `<button class="px-3 py-1 border rounded text-sm ${page <= 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}" ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">上一页</button>`;

    // 首页
    if (page > 3) {
        html += `<button class="px-3 py-1 border rounded text-sm text-gray-500 hover:bg-gray-50" onclick="goPage(1)">1</button>`;
        if (page > 4) {
            html += `<span class="px-2 py-1 text-gray-400">...</span>`;
        }
    }

    // 中间页码（以当前页为中心，最多5个）
    let start = Math.max(1, page - 2);
    let end = Math.min(pages, page + 2);
    if (end - start < 4) {
        if (start === 1) {
            end = Math.min(pages, start + 4);
        } else if (end === pages) {
            start = Math.max(1, end - 4);
        }
    }
    for (let i = start; i <= end; i++) {
        html += `<button class="px-3 py-1 border rounded text-sm ${i === page ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-50'}" onclick="goPage(${i})">${i}</button>`;
    }

    // 尾页
    if (page < pages - 2) {
        if (page < pages - 3) {
            html += `<span class="px-2 py-1 text-gray-400">...</span>`;
        }
        html += `<button class="px-3 py-1 border rounded text-sm text-gray-500 hover:bg-gray-50" onclick="goPage(${pages})">${pages}</button>`;
    }

    // 下一页
    html += `<button class="px-3 py-1 border rounded text-sm ${page >= pages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}" ${page >= pages ? 'disabled' : ''} onclick="goPage(${page + 1})">下一页</button>`;

    pagination.innerHTML = html;
}
function goPage(p) {
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderCards(currentCategory);
    document.getElementById('capabilityGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function changePageSize() {
    pageSize = parseInt(document.getElementById('pageSizeSelect').value);
    currentPage = 1;
    renderCards(currentCategory);
}

/* ---------- Example Request Generator (with field annotations) ---------- */
function getExampleValue(key, type) {
    switch (key) {
        case 'task_id': return 2084;
        case 'issue_id': return 301;
        case 'project_id': return 12;
        case 'mr_iid': return 42;
        case 'limit': return 5;
        case 'status': return 'success';
        case 'filter': return 'unread';
        case 'severity': return 'high';
        case 'category': return 'security';
        case 'period': return 'week';
        case 'group_by': return 'day';
        case 'mine': return true;
        case 'admin_view': return false;
        case 'user_review_comment': return '第32行的并发处理判断有误，应该用 channel 而非锁';
        case 'selected_comment_ids': return [1, 3];
        case 'comment': return '已修复，增加了 null 校验';
        case 'reason': return '已经做了严格校验，不会出现该问题';
        default:
            if (type === 'integer') return 1234;
            if (type === 'boolean') return false;
            if (type === 'array') return [];
            return '...';
    }
}

function generateAnnotatedRequest(t) {
    if (!t.params || t.params.length === 0) return '{}';
    const lines = [];
    lines.push('{');
    t.params.forEach((p, i) => {
        const val = getExampleValue(p.n, p.t);
        const comma = i < t.params.length - 1 ? ',' : '';
        const line = `  "${p.n}": ${JSON.stringify(val)}${comma}`;
        // 计算填充空格使注释右对齐
        const padding = Math.max(1, 38 - line.length);
        const reqMark = p.r ? '必填' : '可选';
        const comment = (p.d || '') + (p.d && p.d.includes(reqMark) ? '' : `（${reqMark}）`);
        lines.push(line + ' '.repeat(padding) + '// ' + comment);
    });
    lines.push('}');
    return lines.join('\n');
}

function inferResponseComments(jsonStr) {
    try {
        const obj = JSON.parse(jsonStr);
        const comments = {};
        for (const [k, v] of Object.entries(obj)) {
            if (k === 'data') comments[k] = '业务数据';
            else if (k === 'success') comments[k] = '是否执行成功';
            else if (k === 'message') comments[k] = '返回消息';
            else if (k === 'task_id') comments[k] = '任务 ID';
            else if (k === 'issue_id') comments[k] = 'Issue ID';
            else if (k === 'status') comments[k] = '状态';
            else if (k === 'total') comments[k] = '总记录数';
            else if (k === 'marked_count') comments[k] = '标记数量';
            else if (Array.isArray(v)) comments[k] = '数组';
            else if (typeof v === 'object' && v !== null) comments[k] = '嵌套对象';
            else comments[k] = typeof v;
        }
        return comments;
    } catch (e) { return {}; }
}

function annotateJSONString(jsonStr, fieldComments) {
    // 先 pretty-print
    let pretty;
    try { pretty = JSON.stringify(JSON.parse(jsonStr), null, 2); }
    catch (e) { pretty = jsonStr; }

    const lines = pretty.split('\n');
    return lines.map(line => {
        const match = line.match(/^(\s*)"([^"]+)":/);
        if (!match) return line;
        const key = match[2];
        const comment = fieldComments[key];
        if (!comment) return line;
        const padding = Math.max(1, 38 - line.length);
        return line + ' '.repeat(padding) + '// ' + comment;
    }).join('\n');
}

/* ---------- Detail Modal ---------- */
function openDetail(toolName) {
    const t = MCP_TOOLS.find(x=>x.tool_name===toolName);
    if(!t) return;
    document.getElementById('modalTitle').textContent = t.display_name;

    const categoryBadge = t.category === 'query' ? '<span class="modal-badge modal-badge-blue">只读</span>'
        : t.category === 'write' ? '<span class="modal-badge modal-badge-amber">可写</span>'
        : '<span class="modal-badge" style="background:#dcfce7;color:#15803d;">统计</span>';
    const dangerousBadge = t.dangerous ? '<span class="modal-badge" style="background:#fee2e2;color:#991b1b;margin-left:.25rem;">需确认</span>' : '';

    const reqExample = generateAnnotatedRequest(t);
    const respRaw = t.response_example || '{"success":true}';
    const respComments = inferResponseComments(respRaw);
    const respExample = annotateJSONString(respRaw, respComments);

    document.getElementById('modalBody').innerHTML = `
        <!-- 顶部元信息 -->
        <div class="modal-meta" style="margin-bottom:1rem;">
            ${categoryBadge}${dangerousBadge}
            <span style="font-size:.75rem;color:#94a3b8;">${escapeHtml(t.tool_name)}</span>
        </div>

        <!-- 描述 -->
        <div class="modal-section">
            <div class="modal-desc">${escapeHtml(t.description)}</div>
        </div>

        <!-- 请求示例 -->
        <div class="modal-section">
            <div class="modal-label"><i class="fas fa-paper-plane" style="font-size:.625rem;"></i> 请求示例</div>
            <div class="modal-code-block" style="white-space:pre;">${escapeHtml(reqExample)}</div>
        </div>

        <!-- 返回示例 -->
        <div class="modal-section">
            <div class="modal-label"><i class="fas fa-reply" style="font-size:.625rem;"></i> 返回示例</div>
            <div class="modal-code-block" style="white-space:pre;">${escapeHtml(respExample)}</div>
        </div>

        ${t.requires && t.requires.length ? `<div class="modal-section"><div class="modal-warning"><i class="fas fa-info-circle"></i>前置条件: 需要 ${t.requires.join(', ')}</div></div>` : ''}

        <!-- 示例话术 -->
        <div class="modal-section">
            <div class="modal-label"><i class="fas fa-comment-dots" style="font-size:.625rem;"></i> 示例话术</div>
            <div>${t.phrases.map(p=>`<span class="modal-phrase">${escapeHtml(p)}</span>`).join('')}</div>
        </div>
    `;
    document.getElementById('detailModal').classList.add('open');
}
function closeModal() { document.getElementById('detailModal').classList.remove('open'); }
document.getElementById('detailModal').addEventListener('click', function(e){
    if(e.target===this) closeModal();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

/* ---------- Status ---------- */
async function checkMCPStatus() {
    const el = document.getElementById('mcpStatus');
    el.className = 'status-badge status-check';
    el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>检测中...</span>';
    try {
        const resp = await fetch('/mcp/v1', { method: 'HEAD', signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            el.className = 'status-badge status-ok';
            el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>服务正常</span>';
        } else {
            el.className = 'status-badge status-err';
            el.innerHTML = `<i class="fas fa-circle" style="font-size:.375rem;"></i><span>HTTP ${resp.status}</span>`;
        }
    } catch (e) {
        el.className = 'status-badge status-err';
        el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>未连接</span>';
    }
}

/* ---------- Init ---------- */
function updateStats() {
    document.getElementById('statTotal').textContent = MCP_TOOLS.length;
    document.getElementById('statQuery').textContent = MCP_TOOLS.filter(t => t.category === 'query').length;
    document.getElementById('statWrite').textContent = MCP_TOOLS.filter(t => t.category === 'write').length;
    document.getElementById('statStats').textContent = MCP_TOOLS.filter(t => t.category === 'stats').length;
}
loadMCPTools();
setTimeout(checkMCPStatus, 600);
</script>
