<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=1"></script>
    <style>html{background-color:#f8fafc;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 能力中心 - CodeGuard</title>
    <script src="js/auth.js?v=7"></script>
    <script src="js/menu-config.js?v=7"></script>
    <script src="js/sidebar.js?v=6"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <script src="/static/js/tailwindcss.min.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #fff;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #64748b;
            --border: #e2e8f0;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
        }
        body { background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

        /* Layout */
        .container { padding: 1.5rem 2rem; max-width: 1440px; margin: 0 auto; }
        @media (max-width: 1023px) { .container { padding: 1rem; } }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem; }
        .header h1 { font-size: 1.25rem; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: .5rem; margin: 0; }
        .header p { margin: .25rem 0 0; font-size: .875rem; color: var(--text-3); }
        .header-actions { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .header-actions a, .header-actions button {
            display: inline-flex; align-items: center; gap: .375rem;
            padding: .4rem .75rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500;
            color: var(--text-2); background: #fff; border: 1px solid var(--border);
            text-decoration: none; cursor: pointer; transition: all .15s;
        }
        .header-actions a:hover, .header-actions button:hover { background: #f8fafc; border-color: #cbd5e1; }

        .status-badge {
            display: inline-flex; align-items: center; gap: .375rem;
            padding: .35rem .75rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500;
        }
        .status-ok { background: #ecfdf5; color: #166534; }
        .status-err { background: #fee2e2; color: #991b1b; }
        .status-check { background: #eff6ff; color: #1e40af; }
        .status-idle { background: #f1f5f9; color: var(--text-3); }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1.5rem; }
        .stat { background: var(--card); border: 1px solid var(--border); border-radius: .75rem; padding: 1rem; display: flex; align-items: center; gap: .75rem; }
        .stat-icon { width: 2.25rem; height: 2.25rem; border-radius: .625rem; display: flex; align-items: center; justify-content: center; font-size: .875rem; }
        .stat-label { font-size: .75rem; color: var(--text-3); font-weight: 500; }
        .stat-num { font-size: 1.25rem; font-weight: 700; color: var(--text); }

        /* Two columns */
        @media (max-width: 1023px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 639px) {
            .stats { grid-template-columns: 1fr; }
        }

        /* Tabs */
        .tabs { display: flex; gap: .25rem; margin-bottom: 1.25rem; padding: .25rem; background: #f1f5f9; border-radius: .625rem; width: fit-content; }
        .tab { padding: .4rem .875rem; border-radius: .5rem; font-size: .8125rem; font-weight: 500; border: none; background: transparent; color: var(--text-3); cursor: pointer; transition: all .15s; }
        .tab:hover { color: var(--text); }
        .tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.07); }

        /* Cards */
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: .75rem; }
        @media (max-width: 639px) { .grid-cards { grid-template-columns: 1fr; } }

        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: .75rem;
            padding: 1rem; transition: box-shadow .2s, border-color .15s; cursor: pointer; position: relative;
        }
        .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.06); border-color: #cbd5e1; }

        .card-top { display: flex; align-items: flex-start; gap: .625rem; }
        .card-icon {
            width: 2rem; height: 2rem; border-radius: .5rem; display: flex; align-items: center; justify-content: center;
            font-size: .875rem; color: #fff; flex-shrink: 0;
        }
        .card-head { flex: 1; min-width: 0; }
        .card-title { font-size: .875rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: .4rem; justify-content: space-between; }
        .card-name { font-family: ui-monospace, 'SF Mono', monospace; font-size: .75rem; color: var(--text-3); font-weight: 400; }
        .card-body { font-size: .8125rem; color: var(--text-2); margin-top: .375rem; line-height: 1.5; }
        .card-tags { display: flex; flex-wrap: wrap; gap: .375rem; margin-top: .5rem; }
        .tag {
            font-size: .6875rem; font-weight: 600; padding: .15rem .5rem; border-radius: 999px; letter-spacing: .01em;
        }
        .tag-blue { background: #eff6ff; color: #1e40af; }
        .tag-amber { background: #fffbeb; color: #92400e; }
        .tag-red { background: #fee2e2; color: #991b1b; }
        .tag-gray { background: #f1f5f9; color: var(--text-2); }

        /* Pagination */
        .pagination {
            display: flex; align-items: center; justify-content: center; gap: .375rem;
            margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid var(--border);
        }
        .pagination-btn {
            min-width: 2rem; height: 2rem; padding: 0 .5rem;
            border-radius: .375rem; font-size: .8125rem; font-weight: 500;
            border: 1px solid var(--border); background: #fff; color: var(--text-2);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all .15s;
        }
        .pagination-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
        .pagination-btn:disabled { opacity: .4; cursor: not-allowed; }
        .pagination-btn.active {
            background: var(--primary); color: #fff; border-color: var(--primary);
        }
        .pagination-info { font-size: .75rem; color: var(--text-3); margin-left: .5rem; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 9999;
            align-items: center; justify-content: center; padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card); border-radius: .75rem; border: 1px solid var(--border);
            width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,.2);
        }
        .modal-head {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.25rem; border-bottom: 1px solid var(--border);
        }
        .modal-title { font-size: 1rem; font-weight: 700; color: var(--text); }
        .modal-close {
            width: 1.75rem; height: 1.75rem; border-radius: .375rem; border: none;
            background: #f1f5f9; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #e2e8f0; color: var(--text); }
        .modal-body { padding: 1.25rem; }
        .modal-section { margin-bottom: 1rem; }
        .modal-section:last-child { margin-bottom: 0; }
        .modal-label { font-size: .75rem; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin-bottom: .375rem; }
        .modal-desc { font-size: .875rem; color: var(--text-2); line-height: 1.6; }
        .modal-table { width: 100%; font-size: .8125rem; border-collapse: collapse; }
        .modal-table th { text-align: left; padding: .4rem .5rem; color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--border); }
        .modal-table td { padding: .4rem .5rem; color: var(--text-2); border-bottom: 1px solid #f1f5f9; }
        .modal-phrase {
            display: inline-block; background: #f8fafc; border: 1px solid #e2e8f0;
            padding: .375rem .625rem; border-radius: .375rem; font-size: .8125rem; color: var(--text-2);
            margin: .125rem .25rem .125rem 0; cursor: default;
        }
        .modal-phrase:hover { border-color: #cbd5e1; background: #fff; }
        .modal-warning {
            background: #fffbeb; border: 1px solid #fde68a; border-radius: .5rem;
            padding: .5rem .75rem; font-size: .8125rem; color: #92400e; display: flex; align-items: flex-start; gap: .375rem;
        }
        .modal-warning i { margin-top: .125rem; flex-shrink: 0; }

        /* Responsive */
        @media (max-width: 1023px) {
            .grid-cards { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
        }
    </style>
</head>
<body class="bg-gray-50">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#f8fafc;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}})();
</script>

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">加载中...</nav>
    </aside>
    <main class="flex-1 overflow-y-auto">
        <div class="container">

            <!-- Header -->
            <div class="header">
                <div>
                    <h1><i class="fas fa-robot text-indigo-600"></i>MCP 能力中心</h1>
                    <p>通过标准 MCP 协议为智能体提供可调用的代码评审能力</p>
                </div>
                <div class="header-actions">
                    <span id="mcpStatus" class="status-badge status-idle"><i class="fas fa-circle" style="font-size:.375rem;"></i><span>未检测</span></span>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat">
                    <div class="stat-icon" style="background:#eef2ff;color:var(--primary);"><i class="fas fa-cubes"></i></div>
                    <div><div class="stat-label">能力总数</div><div class="stat-num">15</div></div>
                </div>
                <div class="stat">
                    <div class="stat-icon" style="background:#eff6ff;color:#3b82f6;"><i class="fas fa-search"></i></div>
                    <div><div class="stat-label">查询类</div><div class="stat-num">9</div></div>
                </div>
                <div class="stat">
                    <div class="stat-icon" style="background:#fffbeb;color:#f59e0b;"><i class="fas fa-edit"></i></div>
                    <div><div class="stat-label">操作类</div><div class="stat-num">3</div></div>
                </div>
                <div class="stat">
                    <div class="stat-icon" style="background:#ecfdf5;color:#10b981;"><i class="fas fa-chart-pie"></i></div>
                    <div><div class="stat-label">统计类</div><div class="stat-num">3</div></div>

            <div class="tabs" id="categoryTabs">
                <button class="tab active" data-category="all" onclick="filterCategory('all')">全部</button>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
    <div class="modal">
        <div class="modal-head">
            <div class="modal-title" id="modalTitle">工具详情</div>
            <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="modalBody"></div>

<script>
const MCP_TOOLS = [
    { toolName:'list_tasks', displayName:'任务列表查询', desc:'查询代码评审任务列表，支持按状态和项目过滤。获取 task_id 的入口。', category:'query', icon:'fa-list', color:'#3b82f6', tags:['只读','分页','需认证'], params:[{n:'status',t:'string',r:false,d:'running|pending|failed|success|stopped'},{n:'project_id',t:'integer',r:false},{n:'mine',t:'boolean',r:false,d:'true'},{n:'limit',t:'integer',r:false,d:'5'}], phrases:['看看我最近的评审任务','列出所有失败的任务','项目 12 最近有哪些 MR 在评审'] },
    { toolName:'get_task', displayName:'任务详情查询', desc:'获取单个评审任务的完整详情（含 MR 信息、评审得分、Issue 数量、使用模型）。', category:'query', icon:'fa-file-alt', color:'#3b82f6', tags:['只读','需认证'], params:[{n:'task_id',t:'integer',r:true}], phrases:['任务 2084 怎么样了','这个评审的得分是多少'], requires:['task_id'] },
    { toolName:'get_task_pipeline', displayName:'Pipeline 详情查询', desc:'查询任务 Pipeline 各阶段执行详情，用于定位"卡在哪一步"或"为什么失败"。', category:'query', icon:'fa-project-diagram', color:'#3b82f6', tags:['只读','需认证'], params:[{n:'task_id',t:'integer',r:true}], phrases:['任务 2084 卡在哪一步','Pipeline 执行到哪了'], requires:['task_id'] },
    { toolName:'get_mr_review', displayName:'MR 评审结果查询', desc:'获取指定任务的 AI 代码评审结果（Issue 列表）。支持按 severity 和 category 过滤。', category:'query', icon:'fa-code', color:'#3b82f6', tags:['只读','需认证','可过滤'], params:[{n:'task_id',t:'integer',r:true},{n:'severity',t:'string',r:false,d:'critical|high|medium|low'},{n:'category',t:'string',r:false,d:'security|performance|style|...'}], phrases:['任务 2084 有什么安全问题','找出所有 critical 的 issue'], requires:['task_id'] },
    { toolName:'get_issue_detail', displayName:'Issue 详情查询', desc:'获取单个 Issue 的完整详情（含代码上下文、详细描述、修复方案）。', category:'query', icon:'fa-search-plus', color:'#3b82f6', tags:['只读','需认证'], params:[{n:'issue_id',t:'integer',r:true}], phrases:['第 3 个 issue 具体是什么','issue 42 的修复建议'], requires:['issue_id'] },
    { toolName:'list_merge_requests', displayName:'MR 列表查询', desc:'查询已触发过 AI 评审的 MR 列表。支持按状态和项目过滤。', category:'query', icon:'fa-code-branch', color:'#3b82f6', tags:['只读','分页','需认证'], params:[{n:'project_id',t:'integer',r:false},{n:'status',t:'string',r:false}], phrases:['看看最近的 MR','有哪些 MR 在评审'] },
    { toolName:'get_merge_request_detail', displayName:'MR 详情查询', desc:'获取指定 MR 的评审详情和对应任务信息。', category:'query', icon:'fa-info-circle', color:'#3b82f6', tags:['只读','需认证'], params:[{n:'project_id',t:'integer',r:true},{n:'mr_iid',t:'integer',r:true}], phrases:['MR !42 评审结果如何','这个 MR 有什么问题'] },
    { toolName:'list_notifications', displayName:'通知列表查询', desc:'查看站内通知列表（评审完成、升级提醒等）。支持 unread/all 过滤。', category:'query', icon:'fa-bell', color:'#3b82f6', tags:['只读','分页','需认证'], params:[{n:'filter',t:'string',r:false,d:'unread|all'}], phrases:['有没有新通知','未读通知有哪些'] },
    { toolName:'list_projects', displayName:'项目列表查询', desc:'查询已接入 AI 代码评审的项目列表。默认只返回我有任务的项目。', category:'query', icon:'fa-folder-open', color:'#3b82f6', tags:['只读','分页','需认证'], params:[{n:'limit',t:'integer',r:false,d:'20'}], phrases:['有哪些项目在用评审','看看所有项目'] },
    { toolName:'retry_task', displayName:'任务重试', desc:'为失败或已停止的任务创建重试任务，重新触发完整 AI 评审。', category:'write', icon:'fa-redo', color:'#f59e0b', tags:['可写','需认证','需确认'], params:[{n:'task_id',t:'integer',r:true}], phrases:['重试任务 2084','重新评审一下','再跑一次'], dangerous:true, requires:['task_id'] },
    { toolName:'stop_task', displayName:'任务停止', desc:'停止正在运行或排队中的评审任务（当前阶段完成后终止）。', category:'write', icon:'fa-stop-circle', color:'#f59e0b', tags:['可写','需认证','需确认'], params:[{n:'task_id',t:'integer',r:true}], phrases:['停掉任务 2084','取消评审','停止正在跑的任务'], dangerous:true, requires:['task_id'] },
    { toolName:'mark_all_read', displayName:'标记全部已读', desc:'一键将当前用户所有未读通知标记为已读。', category:'write', icon:'fa-check-double', color:'#f59e0b', tags:['可写','需认证'], params:[], phrases:['全部标记为已读','清除所有通知'], dangerous:true },
    { toolName:'get_workbench', displayName:'工作台数据查询', desc:'获取个人工作台数据，包含待处理 Issue 统计（按严重程度分档）、超时预警。', category:'stats', icon:'fa-desktop', color:'#10b981', tags:['只读','需认证'], params:[{n:'admin_view',t:'boolean',r:false,d:'false'}], phrases:['我的待办','有哪些问题需要处理','超时预警'] },
    { toolName:'get_dashboard_stats', displayName:'大盘统计查询', desc:'获取代码评审大盘统计（任务量、成功率、失败率、Top 项目）。支持 today/week/month。', category:'stats', icon:'fa-chart-bar', color:'#10b981', tags:['只读','需认证'], params:[{n:'period',t:'string',r:false,d:'today|week|month'}], phrases:['这周评审了多少 MR','成功率多少','团队评审负载如何'] },
    { toolName:'get_token_usage', displayName:'Token 用量查询', desc:'查看 AI 评审 Token 消耗和成本（按天汇总）。支持 day/project/model 分组。', category:'stats', icon:'fa-coins', color:'#10b981', tags:['只读','需认证'], params:[{n:'group_by',t:'string',r:false,d:'day|project|model'}], phrases:['Token 花了多少','AI 调用成本','模型 usage'] }
];

let currentCategory='all', currentPage=1;
const PAGE_SIZE = 12;

/* ---------- Render Cards ---------- */
function renderCards(category) {
    const tools = category==='all' ? MCP_TOOLS : MCP_TOOLS.filter(t=>t.category===category);
    const total = tools.length;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const page = Math.min(currentPage, totalPages);
    const start = (page - 1) * PAGE_SIZE;
    const pageTools = tools.slice(start, start + PAGE_SIZE);

    document.getElementById('capabilityGrid').innerHTML = pageTools.map(t=>`
        <div class="card" onclick="openDetail('${t.toolName}')">
            <div class="card-top">
                <div class="card-icon" style="background:${t.color};"><i class="fas ${t.icon}"></i></div>
                <div class="card-head">
                    <div class="card-title">
                        <span>${t.displayName}</span>
                        <span class="card-name">${t.toolName}</span>
                    </div>
                    <div class="card-body">${t.desc}</div>
                </div>
            </div>
            <div class="card-tags">
                ${t.tags.map(tag=>`<span class="tag ${t.dangerous?'tag-amber':tag==='只读'?'tag-blue':'tag-gray'}">${tag}</span>`).join('')}
            </div>
        </div>
    `).join('');

    renderPagination(page, totalPages, total);
}
function filterCategory(cat) {
    currentCategory = cat;
    currentPage = 1;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.category===cat));
    renderCards(cat);
}
function renderPagination(page, totalPages, total) {
    const container = document.getElementById('paginationBar');
    if (totalPages <= 1) { container.innerHTML = ''; return; }

    let html = `
        <button class="pagination-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}><i class="fas fa-chevron-left"></i></button>
    `;
    for (let i = 1; i <= totalPages; i++) {
        html += `<button class="pagination-btn ${i===page?'active':''}" onclick="goPage(${i})">${i}</button>`;
    }
    html += `
        <button class="pagination-btn" onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}><i class="fas fa-chevron-right"></i></button>
        <span class="pagination-info">${total} 条 · 第 ${page}/${totalPages} 页</span>
    `;
    container.innerHTML = html;
}
function goPage(p) {
    currentPage = p;
    renderCards(currentCategory);
    document.getElementById('capabilityGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ---------- Detail Modal ---------- */
function openDetail(toolName) {
    const t = MCP_TOOLS.find(x=>x.toolName===toolName);
    if(!t) return;
    document.getElementById('modalTitle').textContent = t.displayName;
    document.getElementById('modalBody').innerHTML = `
        <div class="modal-section">
            <div class="modal-label">描述</div>
            <div class="modal-desc">${t.desc}</div>
        </div>
        <div class="modal-section">
            <div class="modal-label">参数</div>
            ${t.params.length ? `
            <table class="modal-table">
                <thead><tr><th>参数</th><th>类型</th><th>必填</th><th>说明</th></tr></thead>
                <tbody>${t.params.map(p=>`<tr><td>${p.n}</td><td>${p.t}</td><td>${p.r?'<span style="color:#ef4444">是</span>':'否'}</td><td>${p.d||'—'}</td></tr>`).join('')}</tbody>
            </table>` : '<div style="font-size:.875rem;color:var(--text-3)">无参数</div>'}
        </div>
        ${t.requires ? `<div class="modal-section"><div class="modal-warning"><i class="fas fa-info-circle"></i>前置条件: 需要 ${t.requires.join(', ')}</div></div>` : ''}
        ${t.warning ? `<div class="modal-section"><div class="modal-warning"><i class="fas fa-exclamation-triangle"></i>${t.warning}</div></div>` : ''}
        <div class="modal-section">
            <div class="modal-label">示例话术</div>
            <div>${t.phrases.map(p=>`<span class="modal-phrase">${p}</span>`).join('')}</div>
        </div>
    `;
    document.getElementById('detailModal').classList.add('open');
}
function closeModal() { document.getElementById('detailModal').classList.remove('open'); }
document.getElementById('detailModal').addEventListener('click', function(e){
    if(e.target===this) closeModal();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

/* ---------- Status ---------- */
async function checkMCPStatus() {
    const el = document.getElementById('mcpStatus');
    el.className = 'status-badge status-check';
    el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>检测中...</span>';
    try {
        const resp = await fetch('/mcp/v1', { method: 'HEAD', signal: AbortSignal.timeout(5000) });
        if (resp.ok) {
            el.className = 'status-badge status-ok';
            el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>服务正常</span>';
        } else {
            el.className = 'status-badge status-err';
            el.innerHTML = `<i class="fas fa-circle" style="font-size:.375rem;"></i><span>HTTP ${resp.status}</span>`;
        }
    } catch (e) {
        el.className = 'status-badge status-err';
        el.innerHTML = '<i class="fas fa-circle" style="font-size:.375rem;"></i><span>未连接</span>';
    }
}

/* ---------- Init ---------- */
renderCards('all');
setTimeout(checkMCPStatus, 600);
</script>
