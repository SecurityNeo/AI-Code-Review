<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=9"></script>
    <style>html{background-color:#1e293b;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 连接诊断 - CodeGuard</title>
    <script src="js/auth.js?v=9"></script>
    <script src="js/menu-config.js?v=9"></script>
    <script src="js/sidebar.js?v=9"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <script src="/static/js/tailwindcss.min.js"></script>
    <style>
        :root { --bg-page:#f8fafc; --card-bg:#fff; --text-primary:#1e293b; --text-secondary:#475569; --border-color:#e2e8f0; --accent:#3b82f6; --accent-hover:#2563eb; --success:#10b981; --danger:#ef4444; --warning:#f59e0b; }
        .page-container { padding:1.25rem 1.75rem; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; flex-wrap:wrap; gap:0.75rem; }
        .page-title { font-size:1.1rem; font-weight:700; }
        .btn-primary { display:inline-flex; align-items:center; gap:0.4rem; background:var(--accent); color:#fff; padding:0.45rem 0.875rem; border-radius:0.5rem; font-size:0.8125rem; font-weight:500; border:none; cursor:pointer; }
        .btn-primary:hover { background:var(--accent-hover); }
        .btn-primary:disabled { opacity:0.6; cursor:not-allowed; }
        .btn-outline { display:inline-flex; align-items:center; gap:0.4rem; background:#fff; color:var(--text-secondary); padding:0.45rem 0.875rem; border-radius:0.5rem; font-size:0.8125rem; font-weight:500; border:1px solid var(--border-color); cursor:pointer; }
        .btn-outline:hover { background:#f8fafc; color:var(--text-primary); }

        /* 诊断步骤 */
        .diagnose-card { background:var(--card-bg); border:1px solid var(--border-color); border-radius:0.625rem; padding:1rem; margin-bottom:0.75rem; display:flex; align-items:flex-start; gap:0.75rem; transition:all 0.2s; }
        .diagnose-card.pending { opacity:0.6; }
        .diagnose-card.running { border-color:var(--accent); background:#eff6ff; }
        .diagnose-card.passed { border-left:3px solid var(--success); }
        .diagnose-card.failed { border-left:3px solid var(--danger); }
        .diagnose-card.warning { border-left:3px solid var(--warning); }
        .diagnose-card.skipped { opacity:0.5; }

        .step-icon { width:2rem; height:2rem; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.75rem; flex-shrink:0; }
        .step-icon.pending { background:#f1f5f9; color:#94a3b8; }
        .step-icon.running { background:var(--accent); color:#fff; animation:pulse 1.5s infinite; }
        .step-icon.passed { background:#dcfce7; color:#166534; }
        .step-icon.failed { background:#fee2e2; color:#991b1b; }
        .step-icon.warning { background:#fef3c7; color:#92400e; }
        .step-icon.skipped { background:#f1f5f9; color:#94a3b8; }

        @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }

        .step-content { flex:1; }
        .step-title { font-size:0.9375rem; font-weight:600; color:var(--text-primary); }
        .step-message { font-size:0.8125rem; color:var(--text-secondary); margin-top:0.25rem; }
        .step-detail { font-size:0.75rem; color:#64748b; margin-top:0.375rem; padding:0.375rem 0.5rem; background:#f8fafc; border-radius:0.375rem; }
        .step-suggestion { font-size:0.75rem; color:#92400e; margin-top:0.375rem; padding:0.375rem 0.5rem; background:#fffbeb; border-radius:0.375rem; display:flex; align-items:flex-start; gap:0.375rem; }

        /* 结果摘要 */
        .result-banner { padding:1rem; border-radius:0.625rem; margin-bottom:1rem; text-align:center; }
        .result-banner.passed { background:#dcfce7; color:#166534; }
        .result-banner.failed { background:#fee2e2; color:#991b1b; }
        .result-banner.partial { background:#fef3c7; color:#92400e; }

        /* 报告区域 */
        .report-section { background:var(--card-bg); border:1px solid var(--border-color); border-radius:0.625rem; padding:1rem; margin-top:1rem; }
        .report-text { background:#f8fafc; border:1px solid var(--border-color); border-radius:0.5rem; padding:0.875rem; font-family:monospace; font-size:0.8125rem; line-height:1.6; white-space:pre-wrap; word-break:break-all; max-height:400px; overflow-y:auto; }

        /* 输入框 */
        .form-input { width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:0.5rem; font-size:0.875rem; outline:none; }
        .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
        .form-label { font-size:0.8125rem; font-weight:500; color:var(--text-primary); display:block; margin-bottom:0.35rem; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){
  function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}
  if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}
})();
</script>

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">加载中...</nav>
    </aside>
    <main class="flex-1 overflow-y-auto">
        <div class="page-container">
            <!-- 页面头部 -->
            <div class="page-header">
                <div>
                    <div class="page-title"><i class="fas fa-stethoscope text-blue-600 mr-2"></i>MCP 连接诊断</div>
                    <div style="font-size:0.8125rem; color:#64748b; margin-top:0.15rem;">一键检测 MCP 连接链路，快速定位配置问题</div>
                </div>
                <div style="display:flex; gap:0.5rem; align-items:center;">
                    <a href="mcp-capabilities.html" class="btn-outline" style="text-decoration:none;">
                        <i class="fas fa-robot"></i>能力中心
                    </a>
                    <a href="mcp-keys.html" class="btn-outline" style="text-decoration:none;">
                        <i class="fas fa-key"></i>密钥管理
                    </a>
                </div>
            </div>

            <!-- 诊断控制区 -->
            <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:0.625rem; padding:1rem; margin-bottom:1rem;">
                <div style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap;">
                    <div style="flex:1; min-width:240px;">
                        <label class="form-label">MCP 服务端地址（可选，默认自动检测当前页面地址）</label>
                        <input type="text" class="form-input" id="clientHost" placeholder="http://10.210.20.20:30335" value="">
                    </div>
                    <div>
                        <button class="btn-primary" id="startBtn" onclick="startDiagnose()">
                            <i class="fas fa-play"></i>开始诊断
                        </button>
                        <button class="btn-outline" id="cancelBtn" onclick="cancelDiagnose()" style="display:none;">
                            <i class="fas fa-stop"></i>取消
                        </button>
                    </div>
                </div>
            </div>

            <!-- 结果摘要（诊断完成后显示） -->
            <div id="resultBanner" style="display:none;"></div>

            <!-- 诊断步骤列表 -->
            <div id="stepsContainer"></div>

            <!-- 诊断报告（诊断完成后显示） -->
            <div class="report-section" id="reportSection" style="display:none;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">
                    <div style="font-size:0.9375rem; font-weight:600;">诊断报告</div>
                    <div style="display:flex; gap:0.5rem;">
                        <button class="btn-outline" onclick="copyReport()">
                            <i class="fas fa-copy"></i>复制文本
                        </button>
                        <button class="btn-outline" onclick="downloadReport()">
                            <i class="fas fa-download"></i>下载 Markdown
                        </button>
                    </div>
                </div>
                <div class="report-text" id="reportText"></div>
                <div style="font-size:0.75rem; color:#94a3b8; margin-top:0.5rem;" id="reportId"></div>
            </div>
        </div>
    </main>
</div>

<script>
let diagnoseRunning = false;
let currentReport = null;

const STEP_DEFS = [
    { step: 1, name: 'api_key_validity', displayName: 'API Key 有效性' },
    { step: 2, name: 'im_binding', displayName: 'IM 账号绑定' },
    { step: 3, name: 'server_reachability', displayName: '服务端可达性' },
    { step: 4, name: 'tool_list_integrity', displayName: 'Tool 列表完整性' },
    { step: 5, name: 'db_connectivity', displayName: '数据库连通性' }
];

function renderSteps(statusMap) {
    const container = document.getElementById('stepsContainer');
    container.innerHTML = STEP_DEFS.map(def => {
        const status = statusMap[def.name] || 'pending';
        const iconMap = {
            pending: '<i class="fas fa-circle" style="font-size:0.5rem;"></i>',
            running: '<i class="fas fa-spinner fa-spin"></i>',
            passed: '<i class="fas fa-check"></i>',
            failed: '<i class="fas fa-times"></i>',
            warning: '<i class="fas fa-exclamation"></i>',
            skipped: '<i class="fas fa-minus"></i>'
        };
        const data = statusMap[def.name + '_data'] || {};
        return `
            <div class="diagnose-card ${status}" id="step-${def.name}">
                <div class="step-icon ${status}">${iconMap[status]}</div>
                <div class="step-content">
                    <div class="step-title">Step ${def.step}: ${def.displayName}</div>
                    <div class="step-message" id="msg-${def.name}">${data.message || '等待检测...'}</div>
                    ${data.detail ? `<div class="step-detail" id="detail-${def.name}">${formatDetail(data.detail)}</div>` : ''}
                    ${data.suggestion ? `<div class="step-suggestion" id="suggest-${def.name}"><i class="fas fa-lightbulb" style="margin-top:0.125rem;"></i><span>${data.suggestion}</span></div>` : ''}
                </div>
            </div>
        `;
    }).join('');
}

function formatDetail(detail) {
    if (typeof detail !== 'object' || detail === null) return String(detail);
    return Object.entries(detail).map(([k, v]) => {
        if (Array.isArray(v)) return `<div><b>${k}:</b> [${v.length} 项]</div>`;
        return `<div><b>${k}:</b> ${v}</div>`;
    }).join('');
}

function updateStep(name, status, data) {
    const card = document.getElementById('step-' + name);
    const msg = document.getElementById('msg-' + name);
    if (card) {
        card.className = 'diagnose-card ' + status;
        const icon = card.querySelector('.step-icon');
        if (icon) icon.className = 'step-icon ' + status;
    }
    if (msg) msg.textContent = data.message || '';
    // 动态添加 detail / suggestion
    const content = card ? card.querySelector('.step-content') : null;
    if (content && data.detail && !document.getElementById('detail-' + name)) {
        const div = document.createElement('div');
        div.className = 'step-detail';
        div.id = 'detail-' + name;
        div.innerHTML = formatDetail(data.detail);
        content.appendChild(div);
    }
    if (content && data.suggestion && !document.getElementById('suggest-' + name)) {
        const div = document.createElement('div');
        div.className = 'step-suggestion';
        div.id = 'suggest-' + name;
        div.innerHTML = '<i class="fas fa-lightbulb" style="margin-top:0.125rem;"></i><span>' + data.suggestion + '</span>';
        content.appendChild(div);
    }
}

async function startDiagnose() {
    if (diagnoseRunning) return;
    diagnoseRunning = true;

    document.getElementById('startBtn').disabled = true;
    document.getElementById('startBtn').innerHTML = '<i class="fas fa-spinner fa-spin"></i>诊断中...';
    document.getElementById('cancelBtn').style.display = 'inline-flex';
    document.getElementById('resultBanner').style.display = 'none';
    document.getElementById('reportSection').style.display = 'none';

    // 初始状态：全部 pending，第一步 running
    const statusMap = {};
    STEP_DEFS.forEach((def, idx) => {
        statusMap[def.name] = idx === 0 ? 'running' : 'pending';
        statusMap[def.name + '_data'] = idx === 0 ? { message: '正在检测...' } : { message: '等待检测' };
    });
    renderSteps(statusMap);

    try {
        const host = document.getElementById('clientHost').value.trim();
        const resp = await apiFetch('/api/v1/mcp/diagnose', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ client_host: host })
        });

        if (resp.steps) {
            // 按顺序更新每一步
            resp.steps.forEach(step => {
                statusMap[step.name] = step.status;
                statusMap[step.name + '_data'] = {
                    message: step.message,
                    detail: step.detail,
                    suggestion: step.suggestion
                };
                updateStep(step.name, step.status, statusMap[step.name + '_data']);
            });
        }

        currentReport = resp;
        showResultBanner(resp.overall, resp.summary);
        generateReport(resp);

    } catch (err) {
        showToast('诊断请求失败: ' + err.message, 'error');
        statusMap['api_key_validity'] = 'failed';
        statusMap['api_key_validity_data'] = { message: '诊断请求失败: ' + err.message };
        updateStep('api_key_validity', 'failed', statusMap['api_key_validity_data']);
    }

    diagnoseRunning = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').innerHTML = '<i class="fas fa-play"></i>重新诊断';
    document.getElementById('cancelBtn').style.display = 'none';
}

function cancelDiagnose() {
    // 简单方案：刷新页面或重置状态
    diagnoseRunning = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('startBtn').innerHTML = '<i class="fas fa-play"></i>开始诊断';
    document.getElementById('cancelBtn').style.display = 'none';
    renderSteps({});
    document.getElementById('resultBanner').style.display = 'none';
    document.getElementById('reportSection').style.display = 'none';
}

function showResultBanner(overall, summary) {
    const banner = document.getElementById('resultBanner');
    const icons = { passed: 'fa-check-circle', failed: 'fa-times-circle', partial: 'fa-exclamation-circle' };
    const titles = { passed: '诊断完成 — MCP 连接正常', failed: '诊断完成 — 发现问题', partial: '诊断完成 — 部分通过' };
    banner.className = 'result-banner ' + overall;
    banner.innerHTML = `
        <div style="font-size:1.25rem; font-weight:700; margin-bottom:0.25rem;">
            <i class="fas ${icons[overall]}"></i> ${titles[overall]}
        </div>
        <div style="font-size:0.875rem;">${summary}</div>
    `;
    banner.style.display = 'block';
}

function generateReport(data) {
    const lines = [];
    lines.push('# MCP 连接诊断报告');
    lines.push('');
    lines.push('生成时间: ' + new Date().toLocaleString());
    lines.push('报告 ID: ' + (data.report_id || 'N/A'));
    lines.push('诊断结果: ' + data.summary);
    lines.push('');
    lines.push('## 详细检查项');
    lines.push('');

    (data.steps || []).forEach(step => {
        const statusIcon = { passed: '[通过]', failed: '[失败]', warning: '[警告]', skipped: '[跳过]' }[step.status] || '[?]';
        lines.push('### ' + step.step + '. ' + step.display_name + ' ' + statusIcon);
        lines.push('- 结果: ' + step.message);
        if (step.detail && Object.keys(step.detail).length > 0) {
            lines.push('- 详情:');
            Object.entries(step.detail).forEach(([k, v]) => {
                if (Array.isArray(v)) {
                    lines.push('  - ' + k + ': [' + v.length + ' 项]');
                } else {
                    lines.push('  - ' + k + ': ' + v);
                }
            });
        }
        if (step.suggestion) {
            lines.push('- 建议: ' + step.suggestion);
        }
        lines.push('');
    });

    lines.push('## 技术支持');
    lines.push('如问题仍未解决，请联系技术支持并提供本报告。');

    const reportText = lines.join('\n');
    document.getElementById('reportText').textContent = reportText;
    document.getElementById('reportId').textContent = '报告 ID: ' + (data.report_id || 'N/A');
    document.getElementById('reportSection').style.display = 'block';
}

function copyReport() {
    const text = document.getElementById('reportText').textContent;
    navigator.clipboard.writeText(text).then(() => {
        showToast('报告已复制到剪贴板', 'success');
    }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('报告已复制到剪贴板', 'success');
    });
}

function downloadReport() {
    const text = document.getElementById('reportText').textContent;
    const blob = new Blob([text], { type: 'text/markdown' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'mcp-diagnose-report.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function showToast(message, type) {
    const colors = { success: 'background:#10b981;', error: 'background:#ef4444;', info: 'background:#3b82f6;' };
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;top:1rem;right:1rem;${colors[type] || colors.info} color:#fff;padding:0.75rem 1.25rem;border-radius:0.5rem;font-size:0.875rem;font-weight:500;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:9999;transition:opacity 0.3s ease;`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// 初始化
renderSteps({});
</script>

</body>
</html>
