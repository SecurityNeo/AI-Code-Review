<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=9"></script>
    <style>html{background-color:#1e293b;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 用量 - CodeGuard</title>
    <script defer src="/static/js/echarts.min.js"></script>
    <script src="js/auth.js?v=9"></script>
    <script src="/js/org-select.js?v=14"></script>
    <script src="js/menu-config.js?v=9"></script>
    <script src="js/sidebar.js?v=9"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <script defer src="/static/js/tailwindcss.min.js"></script>
    <style>
        .chart-card { transition: all 0.3s ease; overflow: hidden; }
        .chart-card:hover { box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .data-table tr:hover { background: #f8f9ff; }
        .data-table th {
            padding: 12px 16px;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e0e0e0;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .data-table td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; color: #333; font-size: 13px; }
        .badge-success { background: #e8f5e9; color: #2e7d32; }
        .badge-failed { background: #ffebee; color: #c62828; }
        .badge-score { background: #e3f2fd; color: #1565c0; }
        .data-table-wrap { max-height: 480px; overflow-y: auto; }

        /* 组织 Token 用量瀑布图 */
        .org-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: background .15s; }
        .org-row:hover { background: #f8fafc; }
        .org-row-head { font-weight: 600; background: #f1f5f9; }
        .org-toggle { width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 11px; flex-shrink: 0; }
        .org-toggle.leaf { visibility: hidden; }
        .org-name { flex: 1; font-size: 13px; color: #1e293b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .org-metric { font-size: 12px; color: #475569; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; text-align: right; min-width: 70px; }
        .org-metric-total { font-weight: 700; color: #111827; }
        .org-bar-wrap { width: 160px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; flex-shrink: 0; position: relative; }
        .org-bar-seg { height: 100%; float: left; }
        .org-bar-seg:nth-child(1) { background: #3b82f6; } /* 输入-蓝 */
        .org-bar-seg:nth-child(2) { background: #10b981; } /* 输出-绿 */
        .org-children { margin-left: 18px; border-left: 1px solid #e2e8f0; padding-left: 8px; }
        .org-children.collapsed { display: none; }
        .org-percent { font-size: 11px; color: #94a3b8; min-width: 40px; text-align: right; }
    </style>
</head>
<body class="bg-gray-50 font-sans">
<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){
  function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}
  if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}
})();
</script>
<div id="toastContainer"></div>
<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding: 20px; text-align: center; color: var(--cg-text-tertiary); font-size: 13px;">加载中...</nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-coins text-orange-500 mr-2"></i>Token 用量监控</h2>
                <p class="text-sm text-gray-500 mt-1">AI 评审大模型调用消耗统计</p>
            </div>
            <button onclick="loadAll()" class="bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-sm hover:bg-blue-100">
                <i class="fas fa-sync-alt mr-1"></i>刷新
            </button>
        </header>

        <div class="p-8 space-y-6">
            <!-- 时间筛选 -->
            <div class="bg-white rounded-xl p-4 border flex items-center gap-4 flex-wrap">
                <div class="flex items-center gap-2">
                    <select id="orgSelect"></select>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-sm text-gray-500">时间范围：</span>
                    <select id="rangeFilter" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" onchange="loadAll()">
                        <option value="today">今日</option>
                        <option value="7d" selected>近 7 天</option>
                        <option value="30d">近 30 天</option>
                    </select>
                </div>
                <div class="ml-auto text-sm text-gray-400" id="lastUpdate">-</div>
            </div>

            <!-- KPI 区 -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4" id="kpiArea">
                <div class="bg-white rounded-xl p-5 border flex flex-col justify-between">
                    <div class="text-xs text-gray-400 font-medium uppercase tracking-wide">总 Tokens</div>
                    <div class="text-2xl font-mono tabular-nums font-bold text-gray-800 mt-1" id="kpiTotalTokens">-</div>
                    <div class="mt-3 h-1 w-full bg-gray-100 rounded-full overflow-hidden flex">
                        <div id="kpiTotalPromptSeg" class="h-full bg-blue-500 rounded-l-full" style="width:0%"></div>
                        <div id="kpiTotalCompletionSeg" class="h-full bg-green-500 rounded-r-full" style="width:0%"></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-5 border flex flex-col justify-between">
                    <div class="text-xs text-gray-400 font-medium uppercase tracking-wide">输入 Tokens</div>
                    <div class="text-2xl font-mono tabular-nums font-bold text-gray-800 mt-1" id="kpiPromptTokens">-</div>
                    <div class="mt-3 h-1 w-full bg-gray-100 rounded-full overflow-hidden">
                        <div id="kpiPromptBar" class="h-full bg-blue-500 rounded-full" style="width:0%"></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-5 border flex flex-col justify-between">
                    <div class="text-xs text-gray-400 font-medium uppercase tracking-wide">输出 Tokens</div>
                    <div class="text-2xl font-mono tabular-nums font-bold text-gray-800 mt-1" id="kpiCompletionTokens">-</div>
                    <div class="mt-3 h-1 w-full bg-gray-100 rounded-full overflow-hidden">
                        <div id="kpiCompletionBar" class="h-full bg-green-500 rounded-full" style="width:0%"></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-5 border flex flex-col justify-between">
                    <div class="text-xs text-gray-400 font-medium uppercase tracking-wide">LLM 调用次数</div>
                    <div class="text-2xl font-mono tabular-nums font-bold text-gray-800 mt-1" id="kpiCallCount">-</div>
                    <div class="mt-3 h-1 w-full bg-gray-100 rounded-full overflow-hidden">
                        <div id="kpiCallBar" class="h-full bg-purple-500 rounded-full" style="width:0%"></div>
                    </div>
                </div>
                <div class="bg-white rounded-xl p-5 border flex flex-col justify-between">
                    <div class="text-xs text-gray-400 font-medium uppercase tracking-wide">平均耗时</div>
                    <div class="text-2xl font-mono tabular-nums font-bold text-gray-800 mt-1" id="kpiAvgDuration">-</div>
                    <div class="mt-3 h-1 w-full bg-gray-100 rounded-full overflow-hidden">
                        <div id="kpiDurationBar" class="h-full bg-yellow-500 rounded-full" style="width:0%"></div>
                    </div>
                </div>
            </div>

            <!-- 组织 Token 用量分布 -->
            <div id="orgTreeSection" class="chart-card bg-white rounded-xl p-6 border" style="display:none;">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800">Token 用量分布</h3>
                    <div>
                        <button id="toggleAllOrgBtn" onclick="toggleAllOrgRowsAuto()" class="text-xs text-blue-600 hover:text-blue-800">全部折叠</button>
                    </div>
                </div>
                <div class="flex items-center gap-3 px-3 py-2 text-sm text-gray-500 font-semibold border-b border-gray-100 mb-2 bg-gray-50 rounded">
                    <div class="org-toggle" style="visibility:hidden"></div>
                    <div class="org-name" style="padding-left:0">组织名称</div>
                    <div class="org-metric">输入 Tokens</div>
                    <div class="org-metric">输出 Tokens</div>
                    <div class="org-metric org-metric-total">总量</div>
                    <div class="org-metric">调用次数</div>
                    <div class="org-bar-wrap" style="background:transparent"></div>
                    <div class="org-percent">占比</div>
                </div>
                <div id="orgTreeBody" class="space-y-1"></div>
            </div>

            <!-- 图表第 1 行：趋势 + 模型占比 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="chart-card bg-white rounded-xl p-6 border">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">Token 用量趋势</h3>
                    <div id="trendChart" style="height: 320px;"></div>
                </div>
                <div class="chart-card bg-white rounded-xl p-6 border">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">模型占比</h3>
                    <div id="modelChart" style="height: 320px;"></div>
                </div>
            </div>

            <!-- 图表第 2 行：项目排行 + 用户排行（上方图例横向单行 + 下方柱状图，每个项目/用户一个颜色） -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="chart-card bg-white rounded-xl p-6 border">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">项目 Token 用量 TOP 10</h3>
                    <div id="projectLegend" class="flex flex-wrap gap-x-3 gap-y-1 mb-4 text-xs"></div>
                    <div id="projectChart" style="height: 320px;"></div>
                </div>
                <div class="chart-card bg-white rounded-xl p-6 border">
                    <h3 class="text-lg font-bold text-gray-800 mb-4">用户 Token 用量 TOP 10</h3>
                    <div id="authorLegend" class="flex flex-wrap gap-x-3 gap-y-1 mb-4 text-xs"></div>
                    <div id="authorChart" style="height: 320px;"></div>
                </div>
            </div>

            <!-- 调用明细表 -->
            <div class="chart-card bg-white rounded-xl p-6 border">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-bold text-gray-800">调用明细</h3>
                    <div class="flex gap-3 flex-wrap">
                        <select id="filterModel" class="px-3 py-2 border rounded-lg text-sm" onchange="loadCalls(1)">
                            <option value="">所有模型</option>
                        </select>
                        <select id="filterCaller" class="px-3 py-2 border rounded-lg text-sm" onchange="loadCalls(1)">
                            <option value="">所有调用方</option>
                        </select>
                        <select id="filterStatus" class="px-3 py-2 border rounded-lg text-sm" onchange="loadCalls(1)">
                            <option value="">所有状态</option>
                            <option value="success">成功</option>
                            <option value="failed">失败</option>
                        </select>
                    </div>
                </div>
                <div class="data-table-wrap">
                    <table class="data-table w-full">
                        <thead>
                            <tr>
                                <th>时间</th>
                                <th>所属组织</th>
                                <th>模型</th>
                                <th>调用方</th>
                                <th style="text-align:right;">输入</th>
                                <th style="text-align:right;">输出</th>
                                <th style="text-align:right;">总计</th>
                                <th style="text-align:right;">耗时</th>
                                <th>状态</th>
                                <th>任务</th>
                            </tr>
                        </thead>
                        <tbody id="callsTableBody">
                            <tr><td colspan="10" class="text-center text-gray-400 py-8">加载中...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div class="flex items-center justify-between mt-4 text-sm text-gray-500">
                    <div id="paginationInfo">-</div>
                    <div class="flex gap-2">
                        <button id="prevPageBtn" onclick="loadCalls(currentPage - 1)" class="px-3 py-1 border rounded disabled:opacity-50" disabled>上一页</button>
                        <button id="nextPageBtn" onclick="loadCalls(currentPage + 1)" class="px-3 py-1 border rounded disabled:opacity-50" disabled>下一页</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const API_BASE = '/api/v1';
    let charts = {};
    let currentPage = 1;
    const pageSize = 20;

    function showToast(message, type = 'success') {
        const colors = { success: 'bg-green-500', error: 'bg-red-500', info: 'bg-blue-500' };
        const icons = { success: 'fa-check', error: 'fa-times', info: 'fa-info' };
        const toast = document.createElement('div');
        toast.className = `toast ${colors[type]} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3`;
        toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${escapeHtml(message)}</span>`;
        document.getElementById('toastContainer').appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }

    function formatNumber(num) {
        if (num == null) return '-';
        if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
        if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
        return num.toString();
    }

    function formatTime(iso) {
        if (!iso) return '-';
        const d = new Date(iso.replace(' ', 'T'));
        if (isNaN(d)) return iso.slice(0, 19).replace('T', ' ');
        const pad = n => String(n).padStart(2, '0');
        const today = new Date();
        const hh = pad(d.getHours()), mm = pad(d.getMinutes()), ss = pad(d.getSeconds());
        if (d.toDateString() === today.toDateString()) return `${hh}:${mm}:${ss}`;
        return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${hh}:${mm}`;
    }

    const CALLER_LABELS = {
        runAIReview:                    { text: 'AI 评审',               cls: 'bg-blue-50 text-blue-700 border-blue-200' },
        runAIReviewStructured:          { text: 'AI 评审（结构化）',     cls: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
        runAIReviewStructuredTruncated: { text: 'AI 评审（截断）',       cls: 'bg-indigo-50 text-indigo-700 border-indigo-200' },
        runAIReviewFallback:            { text: 'AI 评审（分批）',       cls: 'bg-purple-50 text-purple-700 border-indigo-200' },
        single_batch_structured:        { text: '单批次代码评审',        cls: 'bg-blue-50 text-blue-700 border-blue-200' },
        batch_collection:               { text: '多批次代码评审',        cls: 'bg-purple-50 text-purple-700 border-purple-200' },
        review_arbitration:             { text: '评审仲裁',               cls: 'bg-amber-50 text-amber-700 border-amber-200' },
        secret_scan_verify:             { text: '密钥扫描验证',           cls: 'bg-red-50 text-red-700 border-red-200' },
        security_audit_verify:          { text: '安全审计验证',           cls: 'bg-red-50 text-red-700 border-red-200' },
        test_suggestion_enrich:         { text: '测试建议增强',           cls: 'bg-green-50 text-green-700 border-green-200' },
        impact_analysis_enrich:         { text: '影响分析增强',           cls: 'bg-green-50 text-green-700 border-green-200' },
        retry:                          { text: '解析重试',               cls: 'bg-orange-50 text-orange-700 border-orange-200' },
        callLLMAPI:                     { text: 'LLM 调用',               cls: 'bg-gray-100 text-gray-600 border-gray-200' },
        rule_refine:                    { text: '智能提炼',               cls: 'bg-pink-50 text-pink-700 border-pink-200' },
        sandbox_test:                   { text: '模拟测试',               cls: 'bg-teal-50 text-teal-700 border-teal-200' },
        similar_check:                  { text: '相似检测',               cls: 'bg-orange-50 text-orange-700 border-orange-200' },
        score:                          { text: '代码评审',               cls: 'bg-blue-50 text-blue-700 border-blue-200' },
    };
    function renderCallerBadge(caller) {
        const info = CALLER_LABELS[caller] || { text: caller || '-', cls: 'bg-gray-50 text-gray-500 border-gray-200' };
        return `<span class="inline-block px-2 py-0.5 rounded text-xs border ${info.cls}" title="${escapeHtml(caller || '')}">${escapeHtml(info.text)}</span>`;
    }

    function escapeHtml(text) {
        if (text == null) return '';
        const div = document.createElement('div');
        div.textContent = String(text);
        return div.innerHTML;
    }

    // 从 CALLER_LABELS 动态生成调用方筛选下拉框（与表格渲染保持同步）
    function initCallerFilter() {
        const select = document.getElementById('filterCaller');
        if (!select) return;
        // 保留第一个 "所有调用方" 选项
        select.innerHTML = '<option value="">所有调用方</option>';
        Object.entries(CALLER_LABELS).forEach(([key, info]) => {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = info.text;
            select.appendChild(opt);
        });
    }

    function getRange() {
        return document.getElementById('rangeFilter').value;
    }

    async function loadAll() {
        currentPage = 1;
        document.getElementById('lastUpdate').textContent = '更新中...';
        const tasks = [
            ['overview', loadOverview],
            ['trend', loadTrend],
            ['model', loadByModel],
            ['project', loadByProject],
            ['author', loadByAuthor],
            ['calls', () => loadCalls(1)],
            ['orgTree', loadOrgTree]
        ];
        const results = await Promise.allSettled(
            tasks.map(([name, fn]) => {
                try {
                    return fn();
                } catch (syncErr) {
                    console.error(`[loadAll] ${name} sync throw:`, syncErr);
                    return Promise.reject(syncErr);
                }
            })
        );
        let failed = 0;
        results.forEach((r, i) => {
            if (r.status === 'rejected') {
                failed++;
                console.error(`[loadAll] ${tasks[i][0]} failed:`, r.reason);
            }
        });
        document.getElementById('lastUpdate').textContent = failed === 0
            ? '更新于 ' + new Date().toLocaleTimeString('zh-CN')
            : `${failed} 项加载失败，请重试`;
    }

    // showChartEmpty 在图表容器内显示"暂无数据"占位
    function showChartEmpty(domId, chartKey) {
        if (charts[chartKey]) { charts[chartKey].dispose(); charts[chartKey] = null; }
        const dom = document.getElementById(domId);
        dom.innerHTML = '<div class="flex items-center justify-center h-full min-h-[360px] text-gray-400">暂无数据</div>';
    }

    async function loadOverview() {
        const res = await apiFetch(`${API_BASE}/token-usage/overview?range=${getRange()}`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('KPI 接口 HTTP ' + res.status);
        const json = await res.json();
        const d = json.data || {};
        const total = d.total_tokens || 0;
        const prompt = d.prompt_tokens || 0;
        const completion = d.completion_tokens || 0;
        const calls = d.call_count || 0;
        const avgMs = d.avg_duration_ms || 0;

        const elTotal = document.getElementById('kpiTotalTokens');
        const elPrompt = document.getElementById('kpiPromptTokens');
        const elCompletion = document.getElementById('kpiCompletionTokens');
        const elCall = document.getElementById('kpiCallCount');
        const elDuration = document.getElementById('kpiAvgDuration');
        if (elTotal) elTotal.textContent = formatNumber(total);
        if (elPrompt) elPrompt.textContent = formatNumber(prompt);
        if (elCompletion) elCompletion.textContent = formatNumber(completion);
        if (elCall) elCall.textContent = formatNumber(calls);
        if (elDuration) elDuration.textContent = (avgMs / 1000).toFixed(1) + 's';

        const totalPromptSeg = document.getElementById('kpiTotalPromptSeg');
        const totalCompletionSeg = document.getElementById('kpiTotalCompletionSeg');
        if (totalPromptSeg && totalCompletionSeg) {
            const promptRatio = total > 0 ? Math.min((prompt / total) * 100, 100) : 0;
            const completionRatio = total > 0 ? Math.min((completion / total) * 100, 100) : 0;
            totalPromptSeg.style.width = promptRatio + '%';
            totalCompletionSeg.style.width = completionRatio + '%';
        }

        const promptBar = document.getElementById('kpiPromptBar');
        const completionBar = document.getElementById('kpiCompletionBar');
        const callBar = document.getElementById('kpiCallBar');
        const durationBar = document.getElementById('kpiDurationBar');
        if (promptBar) promptBar.style.width = total > 0 ? Math.min((prompt / total) * 100, 100) + '%' : '0%';
        if (completionBar) completionBar.style.width = total > 0 ? Math.min((completion / total) * 100, 100) + '%' : '0%';
        if (callBar) callBar.style.width = Math.min((calls / 10000) * 100, 100) + '%';
        if (durationBar) durationBar.style.width = Math.min((avgMs / 10000) * 100, 100) + '%';
    }

    async function loadTrend() {
        // range=today 自动按小时粒度拉取，横坐标展示 00:00 ~ 当前小时
        const range = getRange();
        const granularity = range === 'today' ? 'hour' : 'day';
        const res = await apiFetch(`${API_BASE}/token-usage/trend?range=${range}&granularity=${granularity}`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('趋势接口 HTTP ' + res.status);
        const json = await res.json();
        const data = json.data || [];
        if (data.length === 0) { showChartEmpty('trendChart', 'trend'); return; }

        // hour 粒度返回 "YYYY-MM-DD HH:00:00" → "HH:00"；day 粒度返回 "YYYY-MM-DD" → "MM-DD"
        const dates = data.map(t => {
            const d = t.date || '';
            return granularity === 'hour' ? d.slice(11, 16) : d.slice(5);
        });
        const promptSeries = data.map(t => t.prompt_tokens || 0);
        const completionSeries = data.map(t => t.completion_tokens || 0);

        if (charts.trend) charts.trend.dispose();
        charts.trend = echarts.init(document.getElementById('trendChart'));
        charts.trend.setOption({
            tooltip: { trigger: 'axis' },
            // 图例顶部居中，避免贴右/被圆角裁剪
            legend: {
                data: ['输入', '输出'],
                top: 0,
                left: 'center',
                itemWidth: 12,
                itemHeight: 8,
                itemGap: 16,
                textStyle: { fontSize: 12 }
            },
            grid: { left: 60, right: 20, top: 36, bottom: 30 },
            xAxis: {
                type: 'category',
                data: dates,
                axisLabel: { fontSize: 11, interval: granularity === 'hour' ? 1 : 'auto' }
            },
            yAxis: { type: 'value', axisLabel: { formatter: v => formatNumber(v) } },
            series: [
                { name: '输入', type: 'line', smooth: true, data: promptSeries, itemStyle: { color: '#3b82f6' }, areaStyle: { opacity: 0.15 } },
                { name: '输出', type: 'line', smooth: true, data: completionSeries, itemStyle: { color: '#10b981' }, areaStyle: { opacity: 0.15 } }
            ]
        });
    }

    function formatModelName(modelName, provider) {
        const name = modelName || '未知模型';
        if (!provider || provider === '-') return name;
        return name + '（' + provider + '）';
    }

    async function loadByModel() {
        const res = await apiFetch(`${API_BASE}/token-usage/by-model?range=${getRange()}`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('模型接口 HTTP ' + res.status);
        const json = await res.json();
        const data = json.data || [];
        if (data.length === 0) { showChartEmpty('modelChart', 'model'); return; }

        if (charts.model) charts.model.dispose();
        charts.model = echarts.init(document.getElementById('modelChart'));
        charts.model.setOption({
            tooltip: { trigger: 'item', formatter: '{b}<br/>{c} tokens ({d}%)' },
            series: [{
                type: 'pie',
                radius: ['45%', '70%'],
                label: { formatter: '{b}\n{d}%' },
                data: data.map(d => ({ name: formatModelName(d.model_name, d.provider), value: d.total_tokens || 0 }))
            }],
            color: ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#6b7280']
        });

        // 同步填充筛选下拉（value 保持原始 model_name，展示增加 provider）
        const sel = document.getElementById('filterModel');
        const cur = sel.value;
        sel.innerHTML = '<option value="">所有模型</option>' +
            data.map(d => {
                const raw = d.model_name || '未知模型';
                const display = formatModelName(d.model_name, d.provider);
                return `<option value="${escapeHtml(raw)}">${escapeHtml(display)}</option>`;
            }).join('');
        sel.value = cur;
    }

    async function loadByProject() {
        const res = await apiFetch(`${API_BASE}/token-usage/by-project?range=${getRange()}&page=1&page_size=10`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('项目接口 HTTP ' + res.status);
        const json = await res.json();
        const data = json.data || [];
        renderTopRank('projectLegend', 'projectChart', data, 'project_name', 'project');
    }

    async function loadByAuthor() {
        const res = await apiFetch(`${API_BASE}/token-usage/by-author?range=${getRange()}&page=1&page_size=10`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('用户接口 HTTP ' + res.status);
        const json = await res.json();
        const data = json.data || [];
        renderTopRank('authorLegend', 'authorChart', data, 'author', 'author');
    }

    // renderTopRank 上方图例（可点击） + 下方 ECharts 柱状图（每个项目/用户一个颜色）
    // 设计：
    //   - 所有名称在图表上方（2 列图例区），不截断、可悬浮查看
    //   - 点击图例项 → 对应柱子高亮（emphasis.focus: 'self'）+ 当前图例加 ring 标记
    //   - 默认高亮第一项
    //   - Y 轴不显示（柱子从最左边开始），右侧数值标签保留
    function renderTopRank(legendDomId, chartDomId, data, nameField, chartKey) {
        const legendEl = document.getElementById(legendDomId);
        const chartEl = document.getElementById(chartDomId);
        if (!data || data.length === 0) {
            legendEl.innerHTML = '';
            if (charts[chartKey]) { charts[chartKey].dispose(); charts[chartKey] = null; }
            chartEl.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">暂无数据</div>';
            return;
        }
        // 按 total_tokens 降序
        const sorted = [...data].sort((a, b) => (b.total_tokens || 0) - (a.total_tokens || 0));
        // 调色板：10 种区分度高的颜色（Tailwind 500 色阶）
        const palette = [
            '#3b82f6', // blue
            '#10b981', // emerald
            '#f59e0b', // amber
            '#ef4444', // red
            '#8b5cf6', // violet
            '#ec4899', // pink
            '#06b6d4', // cyan
            '#84cc16', // lime
            '#f97316', // orange
            '#6366f1', // indigo
        ];
        const values = sorted.map(d => d.total_tokens || 0);

        // 上方图例（2 列，每行：色块 + 完整名；点击高亮对应柱子）
        legendEl.innerHTML = sorted.map((d, idx) => {
            const color = palette[idx % palette.length];
            const name = d[nameField] || '-';
            return `
                <div class="legend-item flex items-center gap-1.5 cursor-pointer px-1.5 py-1 rounded hover:bg-gray-100 transition-colors max-w-[180px] ${idx === 0 ? 'is-active ring-2 ring-blue-400 bg-blue-50/50' : ''}"
                     data-idx="${idx}"
                     title="${escapeHtml(name)}">
                    <span class="w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:${color}"></span>
                    <span class="truncate text-gray-700">${escapeHtml(name)}</span>
                </div>
            `;
        }).join('');

        // 下方柱状图：Y 轴不显示，柱子从最左边开始；emphasis.focus:'self' 让未选中柱子变暗
        if (charts[chartKey]) charts[chartKey].dispose();
        charts[chartKey] = echarts.init(chartEl);
        charts[chartKey].setOption({
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: params => {
                    const p = params[0];
                    const fullName = sorted[p.dataIndex][nameField] || '-';
                    return `<div style="max-width:340px;white-space:normal;word-break:break-all;">${escapeHtml(fullName)}<br/>用量: <b>${formatNumber(p.value)}</b></div>`;
                }
            },
            grid: { left: 4, right: 60, top: 6, bottom: 6, containLabel: false },
            xAxis: { type: 'value', show: false },
            yAxis: {
                type: 'category',
                data: sorted.map(() => ''),   // 不显示 Y 轴标签
                inverse: true,
                axisLine: { show: false },
                axisTick: { show: false },
                splitLine: { show: false }
            },
            series: [{
                type: 'bar',
                data: values.map((v, idx) => ({
                    value: v,
                    itemStyle: { color: palette[idx % palette.length], borderRadius: [0, 4, 4, 0] }
                })),
                barCategoryGap: '40%',
                emphasis: {
                    focus: 'self',  // 只高亮自身，其他柱子变暗
                    itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.3)' }
                },
                label: {
                    show: true,
                    position: 'right',
                    distance: 4,
                    fontSize: 11,
                    color: '#374151',
                    formatter: p => formatNumber(p.value)
                }
            }]
        });

        // 图例点击 → 高亮对应柱子
        legendEl.querySelectorAll('.legend-item').forEach(item => {
            item.addEventListener('click', () => {
                const idx = parseInt(item.dataset.idx, 10);
                // 取消所有高亮
                charts[chartKey].dispatchAction({ type: 'downplay', seriesIndex: 0 });
                // 高亮选中项
                charts[chartKey].dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: idx });
                // 标记当前选中的图例项
                legendEl.querySelectorAll('.legend-item').forEach(el => {
                    el.classList.remove('is-active', 'ring-2', 'ring-blue-400', 'bg-blue-50/50');
                });
                item.classList.add('is-active', 'ring-2', 'ring-blue-400', 'bg-blue-50/50');
            });
        });

        // 默认高亮第一项
        charts[chartKey].dispatchAction({ type: 'highlight', seriesIndex: 0, dataIndex: 0 });
    }

    async function loadCalls(page) {
        if (page < 1) page = 1;
        currentPage = page;
        const params = new URLSearchParams({
            range: getRange(),
            page: String(page),
            page_size: String(pageSize),
        });
        const m = document.getElementById('filterModel').value;
        const c = document.getElementById('filterCaller').value;
        const s = document.getElementById('filterStatus').value;
        if (m) params.set('model_name', m);
        if (c) params.set('caller', c);
        if (s) params.set('status', s);

        const res = await apiFetch(`${API_BASE}/token-usage/calls?${params.toString()}`, { headers: getOrgOverrideHeaders('orgSelect') });
        if (!res.ok) throw new Error('调用明细 HTTP ' + res.status);
        const json = await res.json();
        const rows = json.data || [];
        const tbody = document.getElementById('callsTableBody');

        if (rows.length === 0) {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center text-gray-400 py-8">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = rows.map(r => {
                // 安全转义：task_id 用于 href 必须 encodeURIComponent
                const safeId = r.task_id != null ? encodeURIComponent(r.task_id) : '';
                const taskCell = r.task_id != null
                    ? `<a href="task-detail.html?id=${safeId}" class="text-blue-600 hover:underline">#${escapeHtml(String(r.task_id))}</a>`
                    : '-';
                return `
                    <tr>
                        <td>${(r.created_at || '').slice(0, 19).replace('T', ' ')}</td>
                        <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(r.org_name || '根组织')}</td>
                        <td>${escapeHtml(formatModelName(r.model_name, r.provider))}</td>
                        <td>${renderCallerBadge(r.caller)}</td>
                        <td style="text-align:right;">${formatNumber(r.prompt_tokens)}</td>
                        <td style="text-align:right;">${formatNumber(r.completion_tokens)}</td>
                        <td style="text-align:right;font-weight:600;">${formatNumber(r.total_tokens)}</td>
                        <td style="text-align:right;">${((r.duration_ms || 0) / 1000).toFixed(1)}s</td>
                        <td><span class="text-xs font-medium ${r.status === 'success' ? 'text-green-600' : 'text-red-600'}">${r.status === 'success' ? '成功' : '失败'}</span></td>
                        <td>${taskCell}</td>
                    </tr>
                `;
            }).join('');
        }

        const total = json.total || 0;
        const start = total === 0 ? 0 : (page - 1) * pageSize + 1;
        const end = Math.min(page * pageSize, total);
        document.getElementById('paginationInfo').textContent = `共 ${total} 条，当前 ${start}-${end}`;
        document.getElementById('prevPageBtn').disabled = page <= 1;
        document.getElementById('nextPageBtn').disabled = end >= total;
    }

    // ---------- 组织瀑布图（仅 super_admin） ----------
    let orgTreeState = { expanded: new Set(), data: [], totalTokens: 0 };

    async function loadOrgTree() {
        const section = document.getElementById('orgTreeSection');
        if (!section) { console.warn('[orgTree] orgTreeSection DOM 不存在'); return; }
        try {
            const orgSel = document.getElementById('orgSelect');
            const orgId = orgSel ? orgSel.value : '';
            let url = `${API_BASE}/token-usage/by-org?range=${getRange()}`;
            if (orgId) url += `&org_id=${encodeURIComponent(orgId)}`;
            const res = await apiFetch(url);
            if (res.status === 403) {
                // 非超管，静默隐藏
                section.style.display = 'none';
                return;
            }
            if (!res.ok) {
                const errText = await res.text().catch(() => 'unknown');
                throw new Error('HTTP ' + res.status + ': ' + errText);
            }
            const json = await res.json();
            const roots = json.data || [];
            orgTreeState.data = roots;
            orgTreeState.totalTokens = roots.reduce((sum, n) => sum + (n.total_tokens || 0), 0);
            // 首次加载默认展开全部
            expandAllNodes(roots);
            const bodyEl = document.getElementById('orgTreeBody');
            if (!bodyEl) { console.warn('[orgTree] orgTreeBody DOM 不存在'); return; }
            renderOrgTree(roots, bodyEl, orgTreeState.totalTokens);
            section.style.display = 'block';
        } catch (e) {
            console.error('[orgTree] 加载组织用量失败:', e);
            const bodyEl = document.getElementById('orgTreeBody');
            if (bodyEl) bodyEl.innerHTML = '<div class="text-gray-400 text-sm py-4">加载失败，请刷新页面重试</div>';
            section.style.display = 'block';
        }
    }

    function renderOrgTree(nodes, container, totalTokens) {
        if (!container) { console.warn('[orgTree] renderOrgTree: container is null'); return; }
        try {
            if (!nodes || nodes.length === 0) {
                container.innerHTML = '<div class="text-gray-400 text-sm py-4">暂无数据</div>';
                return;
            }
            container.innerHTML = '';
            nodes.forEach((node, idx) => {
                const rowId = 'org-row-' + node.org_id;
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = orgTreeState.expanded.has(node.org_id);
                const percent = totalTokens > 0 ? ((node.total_tokens || 0) / totalTokens * 100).toFixed(1) : '0.0';
                const promptP = node.total_tokens > 0 ? Math.min(100, Math.max(0, (node.prompt_tokens / node.total_tokens) * 100)).toFixed(1) : '0';
                const completionP = node.total_tokens > 0 ? Math.min(100, Math.max(0, (node.completion_tokens / node.total_tokens) * 100)).toFixed(1) : '0';
                const selfP = node.total_tokens > 0 ? Math.max(0, (100 - parseFloat(promptP) - parseFloat(completionP))).toFixed(1) : '0';

                const row = document.createElement('div');
                row.innerHTML = `
                    <div class="org-row ${hasChildren ? 'org-row-head' : ''}" id="${rowId}" onclick="toggleOrgRow(${node.org_id})">
                        <div class="org-toggle ${hasChildren ? '' : 'leaf'}">
                            ${hasChildren ? (isExpanded ? '<i class="fas fa-caret-down"></i>' : '<i class="fas fa-caret-right"></i>') : ''}
                        </div>
                        <div class="org-name" style="padding-left:0">${escapeHtml(node.org_name || '')}</div>
                        <div class="org-metric">${formatNumber(node.prompt_tokens || 0)}</div>
                        <div class="org-metric">${formatNumber(node.completion_tokens || 0)}</div>
                        <div class="org-metric org-metric-total">${formatNumber(node.total_tokens || 0)}</div>
                        <div class="org-metric">${formatNumber(node.call_count || 0)}</div>
                        <div class="org-bar-wrap" title="输入 ${promptP}% | 输出 ${completionP}% | 自身 ${selfP}%">
                            <div class="org-bar-seg" style="width:${promptP}%"></div>
                            <div class="org-bar-seg" style="width:${completionP}%"></div>
                            <div class="org-bar-seg" style="width:${Math.max(0, selfP)}%;background:#f59e0b"></div>
                        </div>
                        <div class="org-percent">${percent}%</div>
                    </div>
                    <div class="org-children ${isExpanded ? '' : 'collapsed'}" id="children-${node.org_id}"></div>
                `;
                container.appendChild(row);

                if (hasChildren) {
                    const childContainer = row.querySelector('#children-' + node.org_id);
                    if (childContainer) {
                        renderOrgTree(node.children, childContainer, totalTokens);
                    }
                }
            });
            updateToggleAllBtn();
        } catch (renderErr) {
            console.error('[orgTree] renderOrgTree 异常:', renderErr);
            container.innerHTML = '<div class="text-red-400 text-sm py-4">渲染失败</div>';
        }
    }

    function toggleOrgRow(orgId) {
        const childEl = document.getElementById('children-' + orgId);
        const rowEl = document.getElementById('org-row-' + orgId);
        if (!childEl) return;
        const isCollapsed = childEl.classList.contains('collapsed');
        if (isCollapsed) {
            childEl.classList.remove('collapsed');
            orgTreeState.expanded.add(orgId);
            const icon = rowEl.querySelector('.org-toggle');
            if (icon) icon.innerHTML = '<i class="fas fa-caret-down"></i>';
        } else {
            childEl.classList.add('collapsed');
            orgTreeState.expanded.delete(orgId);
            const icon = rowEl.querySelector('.org-toggle');
            if (icon) icon.innerHTML = '<i class="fas fa-caret-right"></i>';
        }
        updateToggleAllBtn();
    }

    function toggleAllOrgRows(expand) {
        orgTreeState.data.forEach(node => {
            toggleOrgTreeRecursive(node, expand);
        });
        renderOrgTree(orgTreeState.data, document.getElementById('orgTreeBody'), orgTreeState.totalTokens);
    }

    function toggleOrgTreeRecursive(node, expand) {
        if (expand) {
            orgTreeState.expanded.add(node.org_id);
        } else {
            orgTreeState.expanded.delete(node.org_id);
        }
        if (node.children) {
            node.children.forEach(c => toggleOrgTreeRecursive(c, expand));
        }
    }

    function expandAllNodes(nodes) {
        nodes.forEach(node => {
            orgTreeState.expanded.add(node.org_id);
            if (node.children && node.children.length > 0) {
                expandAllNodes(node.children);
            }
        });
    }

    function isAllExpanded(nodes) {
        if (!nodes) nodes = orgTreeState.data;
        for (const node of nodes) {
            if (!orgTreeState.expanded.has(node.org_id)) return false;
            if (node.children && node.children.length > 0) {
                if (!isAllExpanded(node.children)) return false;
            }
        }
        return true;
    }

    function updateToggleAllBtn() {
        const btn = document.getElementById('toggleAllOrgBtn');
        if (!btn) return;
        const allExpanded = isAllExpanded();
        btn.textContent = allExpanded ? '全部折叠' : '全部展开';
    }

    function toggleAllOrgRowsAuto() {
        const expand = !isAllExpanded();
        orgTreeState.data.forEach(node => {
            toggleOrgTreeRecursive(node, expand);
        });
        renderOrgTree(orgTreeState.data, document.getElementById('orgTreeBody'), orgTreeState.totalTokens);
    }

    window.addEventListener('resize', () => {
        Object.values(charts).forEach(c => c && c.resize());
    });

    document.addEventListener('DOMContentLoaded', () => {
        if (!isAdmin()) {
            document.querySelector('main').innerHTML = '<div class="p-8 text-center text-gray-500">该页面仅管理员可访问</div>';
            return;
        }
        renderSidebar('token-usage');
        loadOrgSelect('orgSelect');
        initCallerFilter();
        loadAll();
        const orgSel = document.getElementById('orgSelect');
        if (orgSel) {
            orgSel.addEventListener('change', () => {
                initCallerFilter();
                loadAll();
            });
        }
    });
</script>
