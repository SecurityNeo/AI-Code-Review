<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=1"></script>
    <style>html{background-color:#1e293b;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>环节负责人 - CodeGuard</title>
    <script src="js/auth.js?v=5"></script>
    <script src="js/menu-config.js?v=2"></script>
    <script src="js/sidebar.js?v=2"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <style>
        .sidebar-item:hover { background-color: rgba(255,255,255,0.1); }
        .sidebar-item.active { background-color: rgba(255,255,255,0.15); border-left: 3px solid #3b82f6; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){
  function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}
  if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}
})();
</script>

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding: 20px; text-align: center; color: var(--cg-text-tertiary); font-size: 13px;">加载中...</nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-bold text-gray-800">环节负责人管理</h2>
                <p class="text-sm text-gray-500 mt-1">统一管理所有项目的升级通知接收人</p>
            </div>
            <div class="flex items-center gap-3">
                <select id="projectFilter" onchange="loadStewards()" class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="">全部项目</option>
                </select>
                <button onclick="showAddModal()" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">
                    <i class="fas fa-plus mr-1"></i>添加负责人
                </button>
            </div>
        </header>

        <div class="px-8 py-6">
            <div class="bg-white rounded-xl border overflow-hidden">
                <table class="w-full text-sm">
                    <thead class="bg-gray-50 border-b">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">项目</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">匹配类型</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">匹配值</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">GitLab 用户名</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">IM 平台</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold text-gray-500">IM 用户 ID</th>
                            <th class="px-4 py-3 text-center text-xs font-semibold text-gray-500 w-24">操作</th>
                        </tr>
                    </thead>
                    <tbody id="stewardsBody" class="divide-y">
                        <tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- 添加弹框 -->
<div id="addModal" class="fixed inset-0 bg-black/50 z-50 hidden items-center justify-center">
    <div class="bg-white rounded-xl shadow-xl p-6 w-[480px] max-w-[90%]">
        <div class="flex items-center justify-between mb-5">
            <h3 class="font-bold text-gray-900 text-lg">添加环节负责人</h3>
            <button onclick="hideAddModal()" class="text-gray-400 hover:text-gray-600"><i class="fas fa-times"></i></button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">项目</label>
                <select id="addProject" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none"></select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">匹配类型</label>
                <select id="addType" onchange="toggleValueInput()" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="default">默认（全部）</option>
                    <option value="rule_category">规则分类</option>
                    <option value="language">语言</option>
                </select>
            </div>
            <div id="addValueWrap" class="hidden">
                <label class="block text-sm font-medium text-gray-700 mb-1">匹配值</label>
                <input type="text" id="addValue" placeholder="如 security, golang" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">GitLab 用户名</label>
                    <input type="text" id="addGitlabUser" placeholder="gitlab 用户名" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">IM 平台</label>
                    <input type="text" id="addIMPlatform" value="wecom" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">IM 用户 ID</label>
                <input type="text" id="addIMUserID" placeholder="企微 user_id" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>
        <div class="flex justify-end gap-2 mt-6">
            <button onclick="hideAddModal()" class="px-4 py-2 border rounded-lg text-sm text-gray-600 hover:bg-gray-50">取消</button>
            <button onclick="doAdd()" class="px-4 py-2 rounded-lg text-sm text-white bg-blue-600 hover:bg-blue-700">确认添加</button>
        </div>
    </div>
</div>

<script>
const API_BASE = '/api/v1';
let allProjects = [];

async function loadProjects() {
    try {
        const res = await apiFetch(`${API_BASE}/projects?page=1&page_size=1000`);
        const json = await res.json();
        allProjects = json.data || [];
        const sel = document.getElementById('projectFilter');
        const addSel = document.getElementById('addProject');
        sel.innerHTML = '<option value="">全部项目</option>' + allProjects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
        addSel.innerHTML = allProjects.map(p => `<option value="${p.id}">${escapeHtml(p.name)}</option>`).join('');
    } catch (e) { console.error(e); }
}

async function loadStewards() {
    try {
        const projectId = document.getElementById('projectFilter').value;
        let url = `${API_BASE}/project-stewards`;
        if (projectId) url += `?project_id=${projectId}`;
        const res = await apiFetch(url);
        const json = await res.json();
        const stewards = json.data || [];
        const tbody = document.getElementById('stewardsBody');
        const typeLabels = { rule_category: '规则分类', language: '语言', 'default': '默认' };
        if (stewards.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-400">暂无配置</td></tr>';
            return;
        }
        tbody.innerHTML = stewards.map(s => {
            const project = allProjects.find(p => p.id == s.project_id);
            return `
            <tr class="hover:bg-gray-50">
                <td class="px-4 py-3 text-sm text-gray-800">${escapeHtml(project?.name || '项目#' + s.project_id)}</td>
                <td class="px-4 py-3 text-sm text-gray-600">${typeLabels[s.match_type] || s.match_type}</td>
                <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(s.match_value || '-')} <span class="text-xs text-gray-400">(${s.priority || 0})</span></td>
                <td class="px-4 py-3 text-sm font-mono text-gray-700">${escapeHtml(s.gitlab_username)}</td>
                <td class="px-4 py-3 text-sm text-gray-600">${escapeHtml(s.im_platform || '-')}</td>
                <td class="px-4 py-3 text-sm text-gray-600 font-mono">${escapeHtml(s.im_user_id || '-')}</td>
                <td class="px-4 py-3 text-center">
                    <button onclick="deleteSteward(${s.id})" class="text-red-500 hover:text-red-700 text-sm px-2 py-1 rounded hover:bg-red-50">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </td>
            </tr>
            `;
        }).join('');
    } catch (e) { console.error(e); }
}

function showAddModal() {
    document.getElementById('addModal').classList.remove('hidden');
    document.getElementById('addModal').classList.add('flex');
    toggleValueInput();
}
function hideAddModal() {
    document.getElementById('addModal').classList.add('hidden');
    document.getElementById('addModal').classList.remove('flex');
}
function toggleValueInput() {
    const type = document.getElementById('addType').value;
    const wrap = document.getElementById('addValueWrap');
    if (type === 'default') wrap.classList.add('hidden');
    else wrap.classList.remove('hidden');
}

async function doAdd() {
    const payload = {
        project_id: parseInt(document.getElementById('addProject').value),
        match_type: document.getElementById('addType').value,
        match_value: document.getElementById('addValue').value.trim() || null,
        gitlab_username: document.getElementById('addGitlabUser').value.trim(),
        im_platform: document.getElementById('addIMPlatform').value.trim(),
        im_user_id: document.getElementById('addIMUserID').value.trim()
    };
    if (!payload.gitlab_username) { alert('请填写 GitLab 用户名'); return; }
    try {
        const res = await apiFetch(`${API_BASE}/project-stewards`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        showToast('添加成功', 'success');
        hideAddModal();
        loadStewards();
    } catch (e) { showToast('添加失败: ' + e.message, 'error'); }
}

async function deleteSteward(id) {
    if (!confirm('确定删除？')) return;
    try {
        const res = await apiFetch(`${API_BASE}/project-stewards/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        showToast('已删除', 'success');
        loadStewards();
    } catch (e) { showToast('删除失败: ' + e.message, 'error'); }
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

document.addEventListener('DOMContentLoaded', () => {
    renderSidebar('project-stewards');
    loadProjects().then(loadStewards);
});
</script>
<script defer src="/static/js/tailwindcss.min.js"></script>
</body>
</html>
