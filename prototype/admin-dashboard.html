<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=9"></script>
    <style>html{background-color:#1e293b;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 - CodeGuard</title>
    <script src="js/auth.js?v=9"></script>
    <script src="js/menu-config.js?v=9"></script>
    <script src="js/sidebar.js?v=9"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
</head>
<body class="bg-gray-50 font-sans">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){
  function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}
  if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}
})();
</script>

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding: 20px; text-align: center; color: var(--cg-text-tertiary); font-size: 13px;">加载中...</nav>
    </aside>

    <main class="flex-1 overflow-y-auto">
        <header class="bg-white border-b px-8 py-4 flex items-center justify-between sticky top-0 z-10">
            <div>
                <h2 class="text-xl font-bold text-gray-800">🛡️ 管理员控制台</h2>
                <p class="text-sm text-gray-500 mt-1">全局 Issue 治理与通知监控</p>
            </div>
            <button onclick="loadData(true)" class="text-sm text-blue-600 hover:text-blue-800 px-3 py-1.5 rounded hover:bg-blue-50">
                <i class="fas fa-sync-alt mr-1"></i>刷新
            </button>
        </header>

        <div class="px-8 py-6 space-y-6">
            <!-- 核心指标卡片 -->
            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-gray-800" id="kpiTodayNewTotalPending">-</div>
                    <div class="text-xs text-gray-500 mt-1">今日新增 / 总待处理</div>
                    <div class="text-[10px] text-gray-400 mt-0.5" id="kpiTodayNewTotalPendingSub"></div>
                </div>
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-red-600" id="kpiOverdue">-</div>
                    <div class="text-xs text-gray-500 mt-1">积压超期</div>
                    <div class="text-[10px] text-gray-400 mt-0.5" id="kpiOverdueSub"></div>
                </div>
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-purple-600" id="kpiArchived">-</div>
                    <div class="text-xs text-gray-500 mt-1">今日归档 / 总共归档</div>
                </div>
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-orange-600" id="kpiEscalated">-</div>
                    <div class="text-xs text-gray-500 mt-1">今日升级</div>
                </div>
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-blue-600" id="kpiCloseRate">-</div>
                    <div class="text-xs text-gray-500 mt-1">7 天闭环率</div>
                </div>
                <div class="bg-white rounded-xl border p-4 text-center">
                    <div class="text-2xl font-bold text-green-600" id="kpiMedianDays">-</div>
                    <div class="text-xs text-gray-500 mt-1">中位闭环天数</div>
                </div>
            </div>

            <!-- 第二行：IM 投递成功率 + 积压项目告警 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 items-start">
                <div class="bg-white rounded-xl border p-6 flex flex-col h-full">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-paper-plane text-blue-600"></i>IM 投递统计（今日）
                    </h3>
                    <div class="flex-1 flex flex-col justify-center">
                        <div class="grid grid-cols-3 gap-4 text-center">
                            <div>
                                <div class="text-2xl font-bold text-gray-800" id="imTotal">-</div>
                                <div class="text-xs text-gray-500 mt-1">总投递</div>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-green-600" id="imSuccess">-</div>
                                <div class="text-xs text-gray-500 mt-1">成功</div>
                            </div>
                            <div>
                                <div class="text-2xl font-bold text-red-600" id="imFailedRate">-</div>
                                <div class="text-xs text-gray-500 mt-1">失败率</div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 h-4 bg-gray-100 rounded-full overflow-hidden">
                        <div id="imProgressBar" class="h-full bg-green-500 rounded-full" style="width:0%"></div>
                    </div>
                    <div class="mt-2 text-xs text-gray-500 text-right">成功率 <span id="imSuccessRate">-</span></div>
                </div>

                <div class="bg-white rounded-xl border p-6">
                    <h3 class="font-bold text-gray-800 mb-4 flex items-center gap-2">
                        <i class="fas fa-exclamation-triangle text-orange-500"></i>积压项目告警
                    </h3>
                    <div id="alertList" class="space-y-2 text-sm">
                        <div class="text-gray-400 text-center py-4">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 历史遗留概览 -->
            <div class="bg-white rounded-xl border p-4" id="legacyOverviewCard" style="display:none">
                <div class="flex items-center justify-between cursor-pointer" onclick="toggleLegacyOverview()">
                    <div>
                        <h3 class="text-sm font-bold text-gray-700 flex items-center gap-2">
                            <i class="fas fa-archive text-gray-500"></i>历史遗留概览
                        </h3>
                        <p class="text-xs text-gray-400 mt-0.5" id="legacyOverviewSubtitle">加载中...</p>
                    </div>
                    <i id="legacyOverviewIcon" class="fas fa-chevron-down text-gray-400 transition-transform"></i>
                </div>
                <div id="legacyOverviewBody" class="hidden mt-3 pt-3 border-t">
                    <div class="grid grid-cols-3 gap-3 mb-3">
                        <div class="text-center">
                            <div class="text-xl font-bold text-gray-700" id="legacyTotal">-</div>
                            <div class="text-[10px] text-gray-400">历史遗留总数</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xl font-bold text-gray-700" id="legacyProjects">-</div>
                            <div class="text-[10px] text-gray-400">涉及项目</div>
                        </div>
                        <div class="text-center">
                            <div class="text-xl font-bold text-gray-700" id="legacyOldest">-</div>
                            <div class="text-[10px] text-gray-400">最早距今</div>
                        </div>
                    </div>
                    <div id="legacySeverityBars" class="space-y-1.5"></div>
                </div>
            </div>

            <!-- Issue 状态分布 -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 bg-white rounded-xl border p-6">
                    <h3 class="font-bold text-gray-800 mb-4"><i class="fas fa-chart-pie text-blue-600 mr-2"></i>Issue 状态分布</h3>
                    <div id="statusChart" style="height:260px"></div>
                </div>
                <div class="bg-white rounded-xl border p-6">
                    <h3 class="font-bold text-gray-800 mb-4"><i class="fas fa-list-ol text-blue-600 mr-2"></i>待处理最多的项目</h3>
                    <div id="topPendingProjects" class="space-y-2 text-sm"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/static/js/echarts.min.js"></script>
<script>
const API_BASE = '/api/v1';

async function loadData(force = false) {
    try {
        const res = await apiFetch(API_BASE + '/dashboard/admin');
        const data = await res.json();
        const d = data.data || {};

        document.getElementById('kpiTodayNewTotalPending').textContent = `${d.today_new ?? 0} / ${d.total_pending ?? 0}`;
        if (d.notification_baseline_at && (d.total_pending_before_baseline || 0) > 0) {
            document.getElementById('kpiTodayNewTotalPending').innerHTML = `${d.today_new ?? 0} / ${d.total_pending ?? 0}<span class="text-[10px] text-gray-400 ml-1">(历史遗留 ${d.total_pending_before_baseline})</span>`;
        }

        document.getElementById('kpiOverdue').textContent = d.overdue ?? '-';
        if (d.notification_baseline_at && (d.overdue_before_baseline || 0) > 0) {
            document.getElementById('kpiOverdue').innerHTML = `${d.overdue ?? '-'}<span class="text-[10px] text-gray-400 ml-1">(历史遗留 ${d.overdue_before_baseline})</span>`;
        }
        document.getElementById('kpiArchived').textContent = `${d.today_archived ?? 0} / ${d.total_archived ?? 0}`;
        document.getElementById('kpiEscalated').textContent = d.today_escalated ?? '-';
        document.getElementById('kpiCloseRate').textContent = d.week_close_rate ?? '-';
        document.getElementById('kpiMedianDays').textContent = d.median_resolve_days ?? '-';

        // IM 统计
        const imTotal = d.im_total || 0;
        const imSuccess = d.im_success || 0;
        const imFailed = imTotal - imSuccess;
        document.getElementById('imTotal').textContent = imTotal;
        document.getElementById('imSuccess').textContent = imSuccess;
        const failRate = imTotal > 0 ? ((imFailed / imTotal) * 100).toFixed(1) + '%' : '-';
        const successRate = imTotal > 0 ? ((imSuccess / imTotal) * 100).toFixed(1) + '%' : '-';
        document.getElementById('imFailedRate').textContent = failRate;
        document.getElementById('imSuccessRate').textContent = successRate;
        document.getElementById('imProgressBar').style.width = successRate;

        // 积压告警
        renderAlerts(d.alerts || []);

        // 历史遗留概览
        if (d.notification_baseline_at) {
            document.getElementById('legacyOverviewCard').style.display = '';
            await loadLegacyOverview(d.notification_baseline_at);
        } else {
            document.getElementById('legacyOverviewCard').style.display = 'none';
        }

        // 图表
        renderStatusChart(d.status_distribution || {});

        // 待处理最多项目
        renderTopProjects(d.top_pending_projects || []);
    } catch (err) {
        console.error('load admin dashboard failed', err);
    }
}

function renderAlerts(alerts) {
    const container = document.getElementById('alertList');
    container.dataset.alerts = JSON.stringify(alerts);
    if (alerts.length === 0) {
        container.innerHTML = '<div class="text-gray-400 text-center py-4">🎉 当前无积压告警</div>';
        return;
    }
    const expanded = container.dataset.expanded === 'true';
    const total = alerts.length;
    const limit = expanded ? total : Math.min(5, total);
    const visible = alerts.slice(0, limit);

    let html = visible.map(a => `
        <div class="flex items-center justify-between p-2 bg-red-50 rounded border border-red-100">
            <div class="flex items-center gap-2">
                <i class="fas fa-exclamation-circle text-red-500"></i>
                <span class="font-medium text-gray-800">${escapeHtml(a.project_name)}</span>
                <span class="text-xs text-gray-500">
                    待处理 ${a.pending_count}${a.pending_before_baseline > 0 ? '<span class="text-gray-400">(历史遗留 ' + a.pending_before_baseline + ')</span>' : ''}
                     / 超期 ${a.overdue_count}${a.overdue_before_baseline > 0 ? '<span class="text-gray-400">(历史遗留 ' + a.overdue_before_baseline + ')</span>' : ''}
                </span>
            </div>
            <a href="project-dashboard.html?project_id=${a.project_id}" class="text-xs text-blue-600 hover:underline">查看</a>
        </div>
    `).join('');

    if (total > 5) {
        const btnText = expanded ? '收起' : `查看更多 (${total - 5})`;
        html += `<div class="text-center pt-1">
            <button onclick="toggleAlerts()" class="text-xs text-blue-600 hover:text-blue-800 hover:underline focus:outline-none">${btnText}</button>
        </div>`;
    }
    container.innerHTML = html;
}

function toggleAlerts() {
    const container = document.getElementById('alertList');
    container.dataset.expanded = container.dataset.expanded === 'true' ? 'false' : 'true';
    // Re-render with same data stored on container
    const alerts = JSON.parse(container.dataset.alerts || '[]');
    renderAlerts(alerts);
}

function renderStatusChart(dist) {
    const dom = document.getElementById('statusChart');
    if (!dom) return;
    const chart = echarts.init(dom);
    const option = {
        tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
        legend: { orient: 'vertical', left: 'left', textStyle: { fontSize: 11 } },
        series: [{
            type: 'pie',
            radius: ['40%', '70%'],
            avoidLabelOverlap: false,
            itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
            label: { show: false },
            emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold' } },
            data: [
                { value: dist.pending || 0, name: '待处理', itemStyle: { color: '#f59e0b' } },
                { value: dist.pending_inherited || 0, name: '待处理(复现)', itemStyle: { color: '#f97316' } },
                { value: dist.resolved || 0, name: '已处理', itemStyle: { color: '#22c55e' } },
                { value: dist.false_positive || 0, name: '误报', itemStyle: { color: '#ef4444' } },
                { value: dist.ignored || 0, name: '已忽略', itemStyle: { color: '#94a3b8' } },
                { value: dist.auto_filtered || 0, name: '自动过滤', itemStyle: { color: '#e2e8f0' } },
            ]
        }]
    };
    chart.setOption(option);
    window.addEventListener('resize', () => chart.resize());
}

function renderTopProjects(list) {
    const container = document.getElementById('topPendingProjects');
    container.dataset.projects = JSON.stringify(list);
    if (list.length === 0) {
        container.innerHTML = '<div class="text-gray-400 text-center py-4">暂无数据</div>';
        return;
    }
    const expanded = container.dataset.expanded === 'true';
    const total = list.length;
    const limit = expanded ? total : Math.min(5, total);
    const visible = list.slice(0, limit);

    let html = visible.map((p, i) => `
        <div class="flex items-center justify-between py-2 border-b last:border-0">
            <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-gray-400 w-4">${i + 1}</span>
                <span class="text-sm text-gray-800">${escapeHtml(p.name)}</span>
            </div>
            <span class="text-sm font-bold text-orange-600">${p.pending_count}${p.pending_before_baseline > 0 ? '<span class="text-[10px] text-gray-400 font-normal ml-1">(历史遗留 ' + p.pending_before_baseline + ')</span>' : ''}</span>
        </div>
    `).join('');

    if (total > 5) {
        const btnText = expanded ? '收起' : `查看更多 (${total - 5})`;
        html += `<div class="text-center pt-1">
            <button onclick="toggleTopProjects()" class="text-xs text-blue-600 hover:text-blue-800 hover:underline focus:outline-none">${btnText}</button>
        </div>`;
    }
    container.innerHTML = html;
}

function toggleTopProjects() {
    const container = document.getElementById('topPendingProjects');
    container.dataset.expanded = container.dataset.expanded === 'true' ? 'false' : 'true';
    const list = JSON.parse(container.dataset.projects || '[]');
    renderTopProjects(list);
}

function toggleLegacyOverview() {
    const body = document.getElementById('legacyOverviewBody');
    const icon = document.getElementById('legacyOverviewIcon');
    const hidden = body.classList.contains('hidden');
    if (hidden) {
        body.classList.remove('hidden');
        icon.style.transform = 'rotate(180deg)';
    } else {
        body.classList.add('hidden');
        icon.style.transform = '';
    }
}

async function loadLegacyOverview(baselineAt) {
    document.getElementById('legacyOverviewSubtitle').textContent = '通知规则生效起点：' + formatDate(baselineAt);
    try {
        const res = await apiFetch(`${API_BASE}/notification-global-settings/preview?baseline=${encodeURIComponent(baselineAt)}`);
        const json = await res.json();
        const p = json.data || {};
        renderLegacyOverview(p);
    } catch (e) {
        console.error('load legacy overview failed', e);
    }
}

function renderLegacyOverview(d) {
    document.getElementById('legacyTotal').textContent = d.total_affected || 0;
    document.getElementById('legacyProjects').textContent = (d.projects || []).length;
    document.getElementById('legacyOldest').textContent = (d.oldest_issue_days || 0) > 0 ? (d.oldest_issue_days + ' 天') : '-';

    const sev = d.severity_distribution || {};
    const bars = [
        { label: '严重', count: sev.critical || 0, color: 'bg-red-500' },
        { label: '高危', count: sev.high || 0, color: 'bg-orange-500' },
        { label: '中危', count: sev.medium || 0, color: 'bg-yellow-500' },
        { label: '低危', count: sev.low || 0, color: 'bg-blue-400' },
    ];
    const maxCount = Math.max(...bars.map(b => b.count), 1);
    const html = bars.map(b => {
        const pct = Math.round((b.count / maxCount) * 100);
        return `<div class="flex items-center gap-2">
            <span class="text-xs text-gray-500 w-8">${b.label}</span>
            <div class="flex-1 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-full ${b.color} rounded-full" style="width:${pct}%"></div>
            </div>
            <span class="text-xs text-gray-700 w-10 text-right">${b.count}</span>
        </div>`;
    }).join('');
    document.getElementById('legacySeverityBars').innerHTML = html;
}

function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatDate(dateStr) {
    if (!dateStr) return '-';
    try {
        const d = new Date(dateStr);
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
    } catch (e) { return dateStr; }
}

document.addEventListener('DOMContentLoaded', () => {
    loadData();
});
</script>
<script defer src="/static/js/tailwindcss.min.js"></script>
</body>
</html>
