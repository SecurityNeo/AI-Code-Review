<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=9"></script>
    <script src="js/auth.js?v=9"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等待组织分配 - AI Code Guard</title>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0b1121;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 48px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            backdrop-filter: blur(20px);
        }
        .icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            color: #fff;
        }
        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 12px;
        }
        p {
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .info-box {
            background: rgba(59,130,246,0.08);
            border: 1px solid rgba(59,130,246,0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            margin-bottom: 24px;
        }
        .info-box h3 {
            color: #60a5fa;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .info-box li {
            color: rgba(255,255,255,0.5);
            font-size: 13px;
            margin-bottom: 4px;
            margin-left: 16px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(37,99,235,0.35);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            margin-left: 12px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
        }
        .contact {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .contact span {
            color: rgba(255,255,255,0.35);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon"><i class="fas fa-hourglass-half"></i></div>
        <h1>等待组织分配</h1>
        <p>您的账号尚未被分配到任何组织。<br>请联系系统管理员为您分配组织，或接受已有的组织邀请。</p>

        <div class="info-box">
            <h3><i class="fas fa-info-circle"></i> 您可能需要：</h3>
            <li>联系组织的管理员添加您到团队</li>
            <li>接受来自组织管理员的邮件邀请</li>
            <li>如果您是系统管理员，请先在后台创建组织</li>
        </div>

        <div>
            <a href="/login.html" class="btn"><i class="fas fa-sign-in-alt"></i> 返回登录页</a>
        </div>

        <div class="contact">
            <span>如有问题，请联系系统管理员</span>
        </div>
    </div>
</body>
</html>
