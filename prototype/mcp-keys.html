<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="js/theme.js?v=1"></script>
    <style>html{background-color:#1e293b;}</style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP 接入密钥 - CodeGuard</title>
    <script src="js/auth.js?v=7"></script>
    <script src="js/menu-config.js?v=7"></script>
    <script src="js/sidebar.js?v=6"></script>
    <link rel="stylesheet" href="/static/fontawesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/theme.css?v=1">
    <script src="/static/js/tailwindcss.min.js"></script>
    <style>
        :root { --bg-page:#f8fafc; --card-bg:#fff; --text-primary:#1e293b; --text-secondary:#475569; --border-color:#e2e8f0; --accent:#3b82f6; --accent-hover:#2563eb; --success:#10b981; --danger:#ef4444; }
        .page-container { padding:1.25rem 1.75rem; }
        .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.25rem; }
        .page-title { font-size:1.1rem; font-weight:700; }
        .btn-primary { display:inline-flex; align-items:center; gap:0.4rem; background:var(--accent); color:#fff; padding:0.45rem 0.875rem; border-radius:0.5rem; font-size:0.8125rem; font-weight:500; border:none; cursor:pointer; }
        .btn-primary:hover { background:var(--accent-hover); }
        .data-table { width:100%; border-collapse:separate; border-spacing:0; background:var(--card-bg); border-radius:0.625rem; border:1px solid var(--border-color); overflow:hidden; }
        .data-table th { padding:0.55rem 0.875rem; font-size:0.75rem; font-weight:600; text-transform:uppercase; letter-spacing:0.04em; color:#64748b; text-align:left; border-bottom:1px solid var(--border-color); }
        .data-table td { padding:0.65rem 0.875rem; font-size:0.875rem; color:var(--text-secondary); border-bottom:1px solid #f1f5f9; }
        .data-table tbody tr:hover { background:#f8fafc; }
        .badge { display:inline-flex; align-items:center; gap:0.25rem; padding:0.15rem 0.5rem; border-radius:999px; font-size:0.75rem; font-weight:500; }
        .badge-success { background:#dcfce7; color:#166534; }
        .badge-danger { background:#fee2e2; color:#991b1b; }
        .badge-gray { background:#f1f5f9; color:#475569; }
        .toolbar { display:flex; align-items:center; gap:0.625rem; margin-bottom:1rem; background:var(--card-bg); padding:0.5rem 0.75rem; border-radius:0.625rem; border:1px solid var(--border-color); }
        .search-box { position:relative; flex:1; max-width:360px; }
        .search-box input { width:100%; padding:0.45rem 2.5rem; border:1px solid var(--border-color); border-radius:0.5rem; font-size:0.875rem; background:#f8fafc; outline:none; }
        .search-box i { position:absolute; left:0.75rem; top:50%; transform:translateY(-50%); color:#94a3b8; font-size:0.8rem; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:1000; }
        .modal-overlay.active { display:flex; }
        .modal { background:#fff; border-radius:0.75rem; width:560px; max-width:90vw; max-height:90vh; overflow:auto; box-shadow:0 20px 25px -5px rgba(0,0,0,0.1); }
        .modal-header { padding:1rem 1.25rem; border-bottom:1px solid var(--border-color); display:flex; align-items:center; justify-content:space-between; }
        .modal-body { padding:1.25rem; }
        .form-row { margin-bottom:1rem; }
        .form-row label { display:block; font-size:0.8125rem; font-weight:500; color:var(--text-primary); margin-bottom:0.35rem; }
        .form-row input, .form-row select, .form-row textarea { width:100%; padding:0.5rem 0.75rem; border:1px solid var(--border-color); border-radius:0.5rem; font-size:0.875rem; outline:none; }
        .form-row input:focus, .form-row select:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,0.1); }
        .scopes-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:0.5rem; }
        .scope-item { display:flex; align-items:center; gap:0.5rem; padding:0.4rem 0.5rem; border-radius:0.375rem; border:1px solid var(--border-color); cursor:pointer; }
        .scope-item:hover { background:#f8fafc; }
        .scope-item input { width:auto; }
        .btn-text { background:none; border:none; color:var(--accent); font-size:0.8125rem; cursor:pointer; }
        .btn-text-danger { background:none; border:none; color:var(--danger); font-size:0.8125rem; cursor:pointer; }
        .key-display { background:#f0fdf4; border:1px solid #bbf7d0; border-radius:0.5rem; padding:1rem; text-align:center; margin:1rem 0; }
        .key-display code { font-family:monospace; font-size:1rem; color:#166534; word-break:break-all; }
        .pagination { display:flex; align-items:center; justify-content:center; gap:0.5rem; margin-top:1rem; }
        .pagination button { padding:0.35rem 0.75rem; border:1px solid var(--border-color); border-radius:0.375rem; background:#fff; font-size:0.8125rem; cursor:pointer; }
        .pagination button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
        .pagination button:disabled { opacity:0.5; cursor:not-allowed; }
    </style>
</head>
<body class="bg-gray-50 font-sans">

<div id="page-transition" style="position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;z-index:99999;transition:opacity .25s ease;"></div>
<script>
(function(){
  function hide(){var el=document.getElementById('page-transition');if(el){el.style.opacity='0';setTimeout(function(){el.remove();},250);}}
  if(document.readyState==='complete'){hide();}else{window.addEventListener('load',hide);}
})();
</script>

<div class="flex h-screen">
    <aside id="sidebar" class="w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col">
        <nav style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">加载中...</nav>
    </aside>
    <main class="flex-1 overflow-y-auto">
        <div class="page-container">
            <div class="page-header">
                <div>
                    <div class="page-title"><i class="fas fa-key text-blue-600 mr-2"></i>MCP 接入密钥管理</div>
                    <div style="font-size:0.8125rem; color:#64748b; margin-top:0.15rem;">管理第三方智能体接入 CodeGuard 的 API Key</div>
                </div>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="搜索密钥名称..." oninput="debounceLoad()">
                </div>
                <div style="margin-left:auto; display:flex; gap:0.5rem; align-items:center;">
                    <button class="btn-primary" onclick="openCreateModal()">
                        <i class="fas fa-plus"></i>新增接入密钥
                    </button>
                    <button onclick="loadKeys()" class="px-3 py-2 bg-gray-100 text-gray-600 rounded-lg text-sm hover:bg-gray-200 transition">
                        <i class="fas fa-redo mr-1"></i>刷新
                    </button>
                </div>
            </div>

            <table class="data-table">
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>前缀</th>
                        <th>权限范围</th>
                        <th>状态</th>
                        <th>速率限制</th>
                        <th>最近使用</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="keyTableBody">
                    <tr><td colspan="7" style="text-align:center; padding:2rem; color:#94a3b8;">加载中...</td></tr>
                </tbody>
            </table>

            <!-- 分页区域（参考项目列表页风格） -->
            <div class="px-6 py-4 border-t flex items-center justify-between" style="background:var(--card-bg); border:1px solid var(--border-color); border-top:none; border-radius:0 0 0.625rem 0.625rem;">
                <span id="totalCount" class="text-sm text-gray-500">共 0 条记录</span>
                <div class="flex items-center gap-4">
                    <select id="pageSizeSelect" onchange="changePageSize()" class="px-2 py-1 border rounded text-sm">
                        <option value="10">10条/页</option>
                        <option value="20" selected>20条/页</option>
                        <option value="50">50条/页</option>
                    </select>
                    <div id="pagination" class="flex gap-2"></div>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- 创建密钥弹窗 -->
<div class="modal-overlay" id="createModal">
    <div class="modal">
        <div class="modal-header">
            <div style="font-weight:600;">新增 MCP 接入密钥</div>
            <button class="btn-text" onclick="closeCreateModal()">关闭</button>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <label>密钥名称 <span style="color:#ef4444">*</span></label>
                <input type="text" id="keyName" placeholder="例如：企业微信-MCP-生产">
            </div>
            <div class="form-row">
                <label>权限范围（Scopes）<span style="color:#ef4444">*</span></label>
                <div class="scopes-grid" id="scopesGrid"></div>
            </div>
            <div class="form-row">
                <label>IP 白名单（可选）</label>
                <input type="text" id="ipWhitelist" placeholder="逗号分隔，如：10.210.20.40, 10.210.20.41">
            </div>
            <div class="form-row">
                <label>速率限制（请求/分钟）</label>
                <input type="number" id="rateLimit" value="100" min="1" max="10000">
            </div>
            <div class="form-row">
                <label>过期时间（可选）</label>
                <input type="date" id="expiresAt">
            </div>
            <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1.5rem;">
                <button class="btn-text" onclick="closeCreateModal()">取消</button>
                <button class="btn-primary" onclick="createKey()">创建并显示密钥</button>
            </div>
        </div>
    </div>
</div>

<!-- 显示密钥弹窗（一次性） -->
<div class="modal-overlay" id="showKeyModal">
    <div class="modal">
        <div class="modal-header">
            <div style="font-weight:600; color:#166534;"><i class="fas fa-check-circle mr-2"></i>密钥创建成功</div>
        </div>
        <div class="modal-body">
            <div style="background:#fef3c7; border:1px solid #fcd34d; border-radius:0.5rem; padding:0.75rem; margin-bottom:1rem; font-size:0.8125rem; color:#92400e;">
                <i class="fas fa-exclamation-triangle mr-1"></i>密钥只会显示一次，请妥善保存，关闭后将无法再次查看完整密钥。
            </div>
            <div class="key-display">
                <code id="fullKeyDisplay"></code>
            </div>
            <div style="display:flex; justify-content:center; gap:0.5rem;">
                <button class="btn-primary" onclick="copyKey()">
                    <i class="fas fa-copy mr-1"></i>复制到剪贴板
                </button>
            </div>
            <div style="text-align:center; margin-top:1rem;">
                <button class="btn-text" onclick="closeShowKeyModal()">我已保存，关闭</button>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = '/api/v1';
let currentPage = 1;
let pageSize = 20;
let debounceTimer = null;

const AVAILABLE_SCOPES = [
    { value: 'tasks:read', label: '任务查询' },
    { value: 'tasks:write', label: '任务操作（重试/停止）' },
    { value: 'merge_requests:read', label: 'MR 查询' },
    { value: 'workbench:read', label: '工作台查询' },
    { value: 'dashboard:read', label: '大盘统计查询' },
    { value: 'projects:read', label: '项目查询' },
    { value: 'notifications:read', label: '通知查询' },
    { value: 'notifications:write', label: '通知操作' },
    { value: 'team:read', label: '团队查询' },
    { value: 'admin:*', label: '管理操作（全部）' },
];

function initScopesGrid() {
    const grid = document.getElementById('scopesGrid');
    grid.innerHTML = AVAILABLE_SCOPES.map(s => `
        <label class="scope-item">
            <input type="checkbox" value="${s.value}" name="scope">
            <span style="font-size:0.8125rem;">${s.label}</span>
        </label>
    `).join('');
}

async function loadKeys() {
    try {
        const keyword = document.getElementById('searchInput').value;
        const params = new URLSearchParams();
        params.set('page', currentPage);
        params.set('page_size', pageSize);
        if (keyword) params.set('keyword', keyword);

        const res = await apiFetch(`${API_BASE}/mcp-keys?${params}`);
        const json = await res.json();
        const keys = json.data || [];
        const total = json.total || 0;

        const tbody = document.getElementById('keyTableBody');
        if (keys.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:2rem; color:#94a3b8;">暂无数据</td></tr>';
        } else {
            tbody.innerHTML = keys.map(k => {
                let scopes = [];
                try { scopes = JSON.parse(k.scopes || '[]'); } catch(e) {}
                const statusBadge = k.status === 'active'
                    ? '<span class="badge badge-success"><i class="fas fa-check-circle" style="font-size:0.65rem;"></i>启用</span>'
                    : '<span class="badge badge-danger"><i class="fas fa-ban" style="font-size:0.65rem;"></i>禁用</span>';
                const lastUsed = k.last_used_at
                    ? new Date(k.last_used_at).toLocaleString('zh-CN')
                    : '<span style="color:#94a3b8;">从未使用</span>';
                return `
                    <tr>
                        <td style="font-weight:500; color:var(--text-primary);">${escapeHtml(k.name)}</td>
                        <td><code style="background:#f1f5f9; padding:0.15rem 0.4rem; border-radius:0.25rem; font-size:0.8125rem;">${escapeHtml(k.prefix)}...</code></td>
                        <td><span class="badge badge-gray">${scopes.length} 个</span></td>
                        <td>${statusBadge}</td>
                        <td>${k.rate_limit} req/min</td>
                        <td style="font-size:0.8125rem;">${lastUsed}</td>
                        <td>
                            <button class="btn-text" onclick="toggleKey(${k.id}, '${k.status === 'active' ? 'disabled' : 'active'}')">${k.status === 'active' ? '禁用' : '启用'}</button>
                            <button class="btn-text-danger" onclick="deleteKey(${k.id}, '${escapeHtml(k.name)}')">删除</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }
        renderPagination(total, currentPage);
    } catch (err) {
        console.error('load keys failed', err);
        document.getElementById('keyTableBody').innerHTML = `<tr><td colspan="7" style="text-align:center; padding:2rem; color:#ef4444;">加载失败: ${err.message}</td></tr>`;
    }
}

function renderPagination(total, page) {
    const pagination = document.getElementById('pagination');
    if (!pagination) return;

    const totalText = document.getElementById('totalCount');
    if (totalText) totalText.textContent = `共 ${total} 条记录`;

    const totalPages = Math.ceil(total / pageSize);
    const pages = totalPages;
    if (pages <= 1) {
        pagination.innerHTML = '';
        return;
    }

    let html = '';
    // 上一页
    html += `<button class="px-3 py-1 border rounded text-sm ${page <= 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}" ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">上一页</button>`;

    // 首页
    if (page > 3) {
        html += `<button class="px-3 py-1 border rounded text-sm text-gray-500 hover:bg-gray-50" onclick="goPage(1)">1</button>`;
        if (page > 4) {
            html += `<span class="px-2 py-1 text-gray-400">...</span>`;
        }
    }

    // 中间页码（以当前页为中心，最多5个）
    let start = Math.max(1, page - 2);
    let end = Math.min(pages, page + 2);
    if (end - start < 4) {
        if (start === 1) {
            end = Math.min(pages, start + 4);
        } else if (end === pages) {
            start = Math.max(1, end - 4);
        }
    }
    for (let i = start; i <= end; i++) {
        html += `<button class="px-3 py-1 border rounded text-sm ${i === page ? 'bg-blue-600 text-white' : 'text-gray-500 hover:bg-gray-50'}" onclick="goPage(${i})">${i}</button>`;
    }

    // 尾页
    if (page < pages - 2) {
        if (page < pages - 3) {
            html += `<span class="px-2 py-1 text-gray-400">...</span>`;
        }
        html += `<button class="px-3 py-1 border rounded text-sm text-gray-500 hover:bg-gray-50" onclick="goPage(${pages})">${pages}</button>`;
    }

    // 下一页
    html += `<button class="px-3 py-1 border rounded text-sm ${page >= pages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}" ${page >= pages ? 'disabled' : ''} onclick="goPage(${page + 1})">下一页</button>`;

    pagination.innerHTML = html;
}

function changePageSize() {
    pageSize = parseInt(document.getElementById('pageSizeSelect').value) || 20;
    currentPage = 1;
    loadKeys();
}

function goPage(p) { if (p < 1) return; currentPage = p; loadKeys(); }
function debounceLoad() { clearTimeout(debounceTimer); debounceTimer = setTimeout(loadKeys, 300); }

function openCreateModal() { document.getElementById('createModal').classList.add('active'); initScopesGrid(); }
function closeCreateModal() { document.getElementById('createModal').classList.remove('active'); }
function closeShowKeyModal() { document.getElementById('showKeyModal').classList.remove('active'); }

async function createKey() {
    const name = document.getElementById('keyName').value.trim();
    if (!name) { alert('请输入密钥名称'); return; }
    const scopes = Array.from(document.querySelectorAll('input[name="scope"]:checked')).map(cb => cb.value);
    if (scopes.length === 0) { alert('请至少选择一个权限范围'); return; }

    const ipWhitelist = document.getElementById('ipWhitelist').value.trim();
    const rateLimit = parseInt(document.getElementById('rateLimit').value) || 100;
    const expiresAt = document.getElementById('expiresAt').value || null;

    try {
        const res = await apiFetch(`${API_BASE}/mcp-keys`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, scopes, ip_whitelist: ipWhitelist, rate_limit: rateLimit, expires_at: expiresAt })
        });
        const json = await res.json();
        if (json.data && json.data.full_key) {
            document.getElementById('fullKeyDisplay').textContent = json.data.full_key;
            closeCreateModal();
            document.getElementById('showKeyModal').classList.add('active');
            loadKeys();
        } else {
            alert('创建失败: ' + (json.error || '未知错误'));
        }
    } catch (err) {
        alert('创建失败: ' + err.message);
    }
}

function copyKey() {
    const text = document.getElementById('fullKeyDisplay').textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast('已复制到剪贴板', 'success'));
    } else {
        // Fallback for HTTP or older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.left = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            showToast('已复制到剪贴板', 'success');
        } catch (err) {
            console.error('copy failed', err);
            showToast('复制失败，请手动复制：' + text, 'error');
        }
        document.body.removeChild(textarea);
    }
}

// 右上角气泡通知
function showToast(message, type = 'info') {
    const colors = {
        success: 'background:#10b981;',
        error: 'background:#ef4444;',
        info: 'background:#3b82f6;'
    };
    const toast = document.createElement('div');
    toast.style.cssText = `position:fixed;top:1rem;right:1rem;${ colors[type] || colors.info } color:#fff;padding:0.75rem 1.25rem;border-radius:0.5rem;font-size:0.875rem;font-weight:500;box-shadow:0 4px 6px rgba(0,0,0,0.1);z-index:9999;transition:opacity 0.3s ease;`;
    toast.textContent = message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

async function toggleKey(id, status) {
    if (!confirm(`确定要${status === 'active' ? '启用' : '禁用'}该密钥吗？`)) return;
    try {
        await apiFetch(`${API_BASE}/mcp-keys/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status })
        });
        loadKeys();
    } catch (err) {
        alert('操作失败: ' + err.message);
    }
}

async function deleteKey(id, name) {
    if (!confirm(`确定要删除密钥「${name}」吗？此操作不可恢复。`)) return;
    try {
        await apiFetch(`${API_BASE}/mcp-keys/${id}`, { method: 'DELETE' });
        loadKeys();
    } catch (err) {
        alert('删除失败: ' + err.message);
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

loadKeys();
</script>

</body>
</html>
